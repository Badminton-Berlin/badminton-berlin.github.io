const rangeLabel = r => r.from>"0000" || r.to<"9999" ? `${r.from>"0000"?fmtDate(r.from):"start"} – ${r.to<"9999"?fmtDate(r.to):"today"}` : "all time";
function memberStatementHtml(p, rng){
  const st=memberStats(p, rng); const tm=teamMoney(p.team); const net=Math.round(tm.bal[p.id]||0);
  const exp=S.expenses.filter(e=>e.scope==="team"&&e.team===p.team&&(e.date||"")>=rng.from&&(e.date||"")<=rng.to).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const lines=[]; for(const e of exp){ if(e.type==="payment"){ if(e.from===p.id) lines.push({date:e.date, what:`Payment to ${e.to===p.id||e.to===tm.fee?.treasurer?"the club":fullName(byId(S.players,e.to))}`, paid:+e.amount||0, share:0}); else if(e.to===p.id) lines.push({date:e.date, what:`Payment from ${fullName(byId(S.players,e.from))}`, paid:0, share:+e.amount||0}); continue; }
    const n=(e.splitAmong||[]).length; const inSplit=n && (e.splitAmong||[]).includes(p.id); if(e.paidBy===p.id || inSplit) lines.push({date:e.date, what:`${e.title||e.category||"Cost"}${e.sessionId&&byId(S.sessions,e.sessionId)?` · ${fmtDay(byId(S.sessions,e.sessionId).date)}`:""}${n?` · split ${n} ways`:""}`, paid:e.paidBy===p.id?(+e.amount||0):0, share:inSplit?(+e.amount||0)/n:0}); }
  if(tm.fee?.mode==="monthly"){ (tm.fee.dueMonths[p.id]||[]).filter(k=>k>=rng.from.slice(0,7)&&k<=rng.to.slice(0,7)).forEach(k=>lines.push({date:k+"-01", what:`Club fee ${monthLabel(k)}`, paid:0, share:tm.fee.amount})); lines.sort((a,b)=>a.date.localeCompare(b.date)); }
  const paid=lines.reduce((a,l)=>a+l.paid,0), share=lines.reduce((a,l)=>a+l.share,0);
  const ms=matchesOf(p.id).filter(x=>{ const d=allEvents().find(e=>e.id===(x.eventId||"main"))?.date||""; return d>=rng.from && d<=rng.to; }); let w=0,l=0; const mine=S.allPairs.filter(x=>(x.players||[]).includes(p.id)).map(x=>x.id); ms.forEach(x=>{ const r=matchResult(x); if(!r.done) return; const side=mine.includes(x.pairA)?"A":"B"; if(r.winner===side) w++; else l++; });
  return `<h1>${esc(fullName(p))}</h1><div class="muted">${esc(teamName(p.team))} · statement for ${esc(rangeLabel(rng))}</div>
  <div class="kpis"><div class="kpi"><b>${st.played}</b><span>Sessions played</span></div><div class="kpi"><b>${Math.round(st.rate*100)}%</b><span>Attendance</span></div><div class="kpi"><b>${esc(money(Math.round(paid)))}</b><span>Paid</span></div><div class="kpi"><b>${esc(money(Math.round(share)))}</b><span>Your share</span></div><div class="kpi"><b class="${net>=0?"pos":"neg"}">${net>0?"+":""}${esc(money(net))}</b><span>Balance today</span></div><div class="kpi"><b>${w}–${l}</b><span>Matches W–L</span></div></div>
  <h2>Money</h2>${lines.length?`<table><thead><tr><th>Date</th><th>Item</th><th class="n">Paid</th><th class="n">Share</th></tr></thead><tbody>${lines.map(l=>`<tr><td>${esc(fmtDate(l.date))}</td><td>${esc(l.what)}</td><td class="n">${l.paid?esc(money(Math.round(l.paid))):""}</td><td class="n">${l.share?esc(money(Math.round(l.share))):""}</td></tr>`).join("")}<tr class="total"><td colspan="2">Total</td><td class="n">${esc(money(Math.round(paid)))}</td><td class="n">${esc(money(Math.round(share)))}</td></tr></tbody></table>`:`<p class="muted">No costs or payments in this period.</p>`}
  <h2>Sessions (${st.played})</h2>${st.playedList.length?`<table><thead><tr><th>Date</th><th>Time</th><th>Where</th><th class="n">Players</th></tr></thead><tbody>${[...st.playedList].reverse().map(s=>`<tr><td>${esc(fmtDate(s.date))}</td><td>${esc(s.start)}–${esc(s.end)}</td><td>${esc(s.location||"")}</td><td class="n">${attendees(s).length}</td></tr>`).join("")}</tbody></table>`:`<p class="muted">No sessions recorded in this period.</p>`}
  <h2>Matches (${ms.length})</h2>${ms.length?`<table><thead><tr><th>Event</th><th>Match</th><th>Result</th></tr></thead><tbody>${ms.map(x=>{ const ev=allEvents().find(e=>e.id===(x.eventId||"main")); const r=matchResult(x); const pa=byId(S.allPairs,x.pairA), pb=byId(S.allPairs,x.pairB); const lab=pr=>(pr?.players||[]).map(id=>byId(S.players,id)?.first||"?").join(" & "); return `<tr><td>${esc(ev?.name||"")}<br><span class="muted">${esc(fmtDate(ev?.date))}</span></td><td>${esc(lab(pa))} vs ${esc(lab(pb))}</td><td>${r.done?`${(x.games||[]).map(g=>g.join(":")).join(", ")}${x.walkover?" (w/o)":""} · ${r.winner===(mine.includes(x.pairA)?"A":"B")?"won":"lost"}`:"not played"}</td></tr>`; }).join("")}</tbody></table>`:`<p class="muted">No matches in this period.</p>`}`;
}
function clubStatementHtml(t, rng){

  <h2>Sessions (${sessions.length})</h2>${sessions.length?`<table><thead><tr><th>Date</th><th>Where</th><th class="n">Players</th><th>Who played</th></tr></thead><tbody>${sessions.map(s=>`<tr><td>${esc(fmtDate(s.date))}</td><td>${esc(s.location||"")}</td><td class="n">${attendees(s).length}</td><td>${esc(attendees(s).map(id=>byId(S.players,id)?.first||"?").join(", "))}</td></tr>`).join("")}</tbody></table>`:`<p class="muted">No sessions in this period.</p>`}`;

async function linkGoogle(){
  if(isDemo){ S._demoLinked=true; toast("Demo: pretend-linked to Google"); render(); if($("#sheetHost").children.length) sheetPlayer(uid); return; }
  const {mod, a}=S.fbAuth||{}; if(!mod){ toast("Sign-in not available"); return; }
  const prov=new mod.GoogleAuthProvider(); prov.setCustomParameters({prompt:"select_account"});
  try{ await mod.linkWithPopup(a.currentUser, prov); if(me()){ await store.update("players", uid, {linked:"google", updatedAt:Date.now()}).catch(()=>{}); audit("link", "linked Google account"); } toast("Google account connected"); if($("#profForm") && !me()){ const keep={first:$("#pFirst")?.value, last:$("#pLast")?.value, dob:$("#pDob")?.value}; sheetProfile(); if(keep.first!=null){ $("#pFirst").value=keep.first; $("#pLast").value=keep.last; if($("#pDob")) $("#pDob").value=keep.dob; } } else closeSheet(); }
  catch(e){ console.warn(e);
    if(e.code==="auth/credential-already-in-use" || e.code==="auth/email-already-in-use"){ const cred=mod.GoogleAuthProvider.credentialFromError(e);
      confirmSheet("Already linked", "This Google account already belongs to another profile in this app. Switch this device to that profile? (The current unregistered profile on this device is left behind.)", "Switch profile", async ()=>{ try{ await mod.signInWithCredential(a, cred); location.reload(); }catch(err){ toast("Could not switch: "+(err.code||err.message)); } }); }
    else if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e.code)){ try{ await mod.linkWithRedirect(a.currentUser, prov); }catch(err){ toast("Could not open Google sign-in here. Try in Safari/Chrome."); } }
    else if(e.code!=="auth/popup-closed-by-user") toast("Could not link: "+(e.code||e.message)); }
}
async function restoreGoogle(){
  if(isDemo){ toast("Demo mode: restoring works in the live app"); return; }
  const {mod, a}=S.fbAuth||{}; if(!mod){ toast("Sign-in not available"); return; }
  const prov=new mod.GoogleAuthProvider(); prov.setCustomParameters({prompt:"select_account"});
  try{ const r=await mod.signInWithPopup(a, prov); const had=await store.get("players", r.user.uid);
    if(had){ toast("Welcome back!"); lsSet("ppc_restored", true); setTimeout(()=>location.reload(), 700); }
    else { lsSet("ppc_noLink", true); toast("No profile linked to this Google account yet"); setTimeout(()=>location.reload(), 700); } }
  catch(e){ console.warn(e); if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment"].includes(e.code)){ try{ await mod.signInWithRedirect(a, prov); }catch(err){ toast("Could not open Google sign-in here. Try in Safari/Chrome."); } } else if(e.code!=="auth/popup-closed-by-user") toast("Could not sign in: "+(e.code||e.message)); }
}
/* Activity log: who changed what. Written by the app on every important action; readable by admins (all) and club admins (their club). */
const AUDIT_LABELS={score:"Score", expense:"Cost", payment:"Payment", delExpense:"Cost deleted", member:"Member", role:"Role", invite:"Invite", event:"Event", team:"Club setup", schedule:"Schedule", attendance:"Attendance", admin:"Admin", season:"Season", link:"Account", backup:"Backup", pairs:"Pairs"};
function audit(action, detail, extra={}){
  if(!store || !uid) return;
  const m=me(); const rec={at:Date.now(), by:uid, byName: m?fullName(m):(isAdmin()?"Admin ("+uid.slice(0,6)+")":"Unknown"), action, detail:String(detail||"").slice(0,300), team: extra.team!==undefined ? extra.team : (myTeam()||null), eventId: extra.eventId||null};
  try{ Promise.resolve(store.set("audit", store.newId(), rec)).catch(e=>console.warn("audit", e.code||e)); }catch(e){}
}

async function downloadBackup(){

  for(const c of COLS){ try{ out.collections[c]=await store.getAll(c); }catch(e){ out.collections[c]={error:String(e.code||e.message||e)}; } }
  const json=JSON.stringify(out); const name=`badminton-backup-${todayISO()}.json`;
  try{ const blob=new Blob([json],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); toast(`Backup ready (${(json.length/1024).toFixed(0)} KB)`); audit("backup", `downloaded ${name}`, {team:null}); }

/* Seasons: close a season to freeze its statistics; stats and reports then default to the new season while balances carry over. */
function seasonSnapshot(name, from, to){
  const rng={from,to}; const clubs={};
  for(const t of ["A","B"]){ const members=S.players.filter(p=>p.team===t); const tm=teamMoney(t);
    const sessions=S.sessions.filter(s=>s.team===t&&s.date>=from&&s.date<=to&&s.status!=="cancelled");
    const spend=S.expenses.filter(e=>e.scope==="team"&&e.team===t&&e.type!=="payment"&&(e.date||"")>=from&&(e.date||"")<=to).reduce((a,e)=>a+(+e.amount||0),0);
    clubs[t]={name:teamName(t), sessions:sessions.length, spend, members:members.map(p=>{ const st=memberStats(p,rng); return {id:p.id, name:fullName(p), active:isActive(p), played:st.played, offered:st.offered, paid:Math.round(st.paid), share:Math.round(st.share), balance:Math.round(tm.bal[p.id]||0)}; }).sort((a,b)=>b.played-a.played||a.name.localeCompare(b.name))}; }
  const events=allEvents().filter(e=>(e.date||"")>=from&&(e.date||"")<=to).map(ev=>{ const ms=S.allMatches.filter(m=>(m.eventId||"main")===ev.id); let a=0,b=0,done=0; ms.forEach(m=>{const r=matchResult(m); if(r.done){done++; if(r.winner==="A")a++; else b++;}}); const {playerStats}=standingsFor(ev.id); const top=Object.entries(playerStats).map(([id,s])=>({id, name:fullName(byId(S.players,id)), ...s})).sort((a,b)=>b.w-a.w||(b.w/(b.sp||1))-(a.w/(a.sp||1))).slice(0,5); return {id:ev.id, name:ev.name, date:ev.date, type:ev.type, clubs:evClubs(ev), matches:ms.length, played:done, scoreA:a, scoreB:b, top}; });
  return {name, from, to, clubs:["A","B"], closedAt:Date.now(), closedBy:uid||null, shortA:S.event.shortA, shortB:S.event.shortB, data:{clubs, events}};
}

function syncSharing(){
  if(!isAdmin() || !store) return; const want={}; for(const ev of S.events){ const cs=[...new Set(evClubs(ev))].sort(); for(let i=0;i<cs.length;i++) for(let j=i+1;j<cs.length;j++) want[cs[i]+cs[j]]=true; }
  const cur=S.sharingDoc||{}; const same=Object.keys(want).length===Object.keys(cur).length && Object.keys(want).every(k=>cur[k]===true);
  if(!same){ store.set("settings","sharing", want).catch(e=>console.warn("sharing", e.code||e)); }
}

/* ---------------- Payment requests: ask a team-mate for money; they get a notification and a Pay prompt ---------------- */
const reqOpenToMe = ()=> S.requests.filter(r=>r.to===uid && r.status==="open").sort((a,b)=>b.createdAt-a.createdAt);
const reqMine = ()=> S.requests.filter(r=>r.from===uid).sort((a,b)=>b.createdAt-a.createdAt);
const reqStatusPill = r => r.status==="open" ? `<span class="pill warn">open</span>` : r.status==="paid" ? `<span class="pill good">paid</span>` : r.status==="declined" ? `<span class="pill">declined</span>` : `<span class="pill">cancelled</span>`;
function localNotify(title, body, tag){
  try{ if(!("Notification" in window) || Notification.permission!=="granted") return;
    const opts={body, icon:"./icons/icon-192.png", badge:"./icons/icon-192.png", tag:tag||"req", renotify:true};
    if(navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(r=>r.showNotification(title, opts)).catch(()=>{ try{ new Notification(title, opts); }catch(e){} });
    else new Notification(title, opts); }catch(e){}
}
// Called from the Firestore listener: shows a toast + a local notification for new requests to me / requests of mine that got paid.
function onRequestsUpdate(rows){
  const prev=S._reqSeen; S.requests=rows;
  if(prev){
    for(const r of rows){ const was=prev[r.id];
      if(!was && r.to===uid && r.status==="open"){ const p=byId(S.players,r.from); toast(`${p?.first||"Someone"} asks you for ${money(r.amount)}`); localNotify(`${fullName(p)} asks you for ${money(r.amount)}`, r.note||"Open the app to pay in one tap.", "req-"+r.id); }
      if(was && was!==r.status && r.from===uid && r.status==="paid"){ const p=byId(S.players,r.to); toast(`${p?.first||"Someone"} paid your request`); localNotify(`${fullName(p)} paid ${money(r.amount)}`, "Your request is settled.", "req-"+r.id); }
      if(was && was!==r.status && r.from===uid && r.status==="declined"){ const p=byId(S.players,r.to); toast(`${p?.first||"Someone"} declined your request`); }
    }
  }
  S._reqSeen=Object.fromEntries(rows.map(r=>[r.id,r.status]));
}
function sheetRequest(team, to, amt, note){
  const members=S.players.filter(p=>p.team===team && isActive(p) && p.id!==uid).sort((a,b)=>fullName(a).localeCompare(fullName(b)));
  if(!members.length){ toast("Nobody else in your club yet"); return; }
  const tm=teamMoney(team); const owes=id=>{ const x=tm.transfers.find(t=>t.from===id && t.to===uid); return x?Math.round(x.amt):0; };
  openSheet("Request money", `<form id="reqForm" class="stack"><p class="small muted" style="margin:0">The person gets a notification and a Pay button with your PayPal / IBAN. ${hasPayInfo(me())?"":"<b>Tip:</b> add your payment details (Edit profile) so they can pay in one tap."}</p>
    <label class="f">From whom<select id="rqTo">${members.map(p=>`<option value="${p.id}" ${p.id===to?"selected":""}>${esc(fullName(p))}${owes(p.id)?` · owes you ${esc(money(owes(p.id)))}`:""}</option>`).join("")}</select></label>
    <div class="row"><label class="f grow">Amount (${esc(S.event.currency||"€")})<input id="rqAmt" required inputmode="decimal" value="${amt?(amt/100).toFixed(2):""}" placeholder="12.00"></label></div>
    <label class="f">What for<input id="rqNote" value="${esc(note||"")}" placeholder="${esc(tm.fee?.mode==="monthly"?"Club fee":"Court share Sunday")}" maxlength="80"></label>
  </form>`, `<button class="btn primary" data-act="sendRequest" data-team="${team}">Send request</button>`);
  $("#rqTo").addEventListener("change", e=>{ const n=owes(e.target.value); if(n) $("#rqAmt").value=(n/100).toFixed(2); });
}
async function sendRequest(team){
  const f=$("#reqForm"); if(!f.reportValidity()) return; const to=$("#rqTo").value; const amt=Math.round(parseFloat($("#rqAmt").value.replace(",","."))*100); if(!(amt>0)){ toast("Enter a valid amount"); return; }
  const note=$("#rqNote").value.trim(); const id=store.newId();
  await store.set("requests", id, {team, from:uid, fromName:fullName(me()), to, toName:fullName(byId(S.players,to)), amount:amt, note, status:"open", notifyPending:true, createdAt:Date.now(), updatedAt:Date.now()});
  audit("payment", `requested ${money(amt)} from ${fullName(byId(S.players,to))}${note?" · "+note:""}`, {team});
  closeSheet(); toast(`Request sent to ${byId(S.players,to)?.first||"them"}`);
}
function requestsBanner(){
  const list=reqOpenToMe(); if(!list.length || amInactive()) return "";
  return list.slice(0,3).map(r=>{ const p=byId(S.players,r.from); return `<div class="banner" style="display:block;background:var(--team-a-soft);color:var(--fg)"><div class="row spread" style="gap:8px"><span class="row" style="gap:8px;min-width:0">${avatar(p,"sm")}<span><b>${esc(p?fullName(p):r.fromName||"Someone")}</b> asks you for <b>${esc(money(r.amount))}</b>${r.note?`<br><span class="small" style="font-weight:400">${esc(r.note)}</span>`:""}</span></span><span class="row" style="gap:6px;flex:none"><button class="btn primary sm" data-act="payRequest" data-id="${r.id}">Pay</button><button class="btn ghost sm" data-act="declineRequest" data-id="${r.id}">Decline</button></span></div></div>`; }).join("");
}
function requestsCard(t){
  const toMe=reqOpenToMe().filter(r=>r.team===t), mine=reqMine().filter(r=>r.team===t).slice(0,8);
  if(!toMe.length && !mine.length) return "";
  const row=(r, incoming)=>{ const p=byId(S.players, incoming?r.from:r.to); const age=Math.floor((Date.now()-r.createdAt)/864e5);
    return `<div class="row spread" style="gap:8px"><span class="row" style="gap:8px;min-width:0">${avatar(p,"sm")}<span style="min-width:0"><b>${incoming?"":"to "}${esc(p?fullName(p):(incoming?r.fromName:r.toName)||"?")}</b> · ${esc(money(r.amount))}${r.note?`<br><span class="tiny muted">${esc(r.note)}</span>`:""}<br><span class="tiny muted">${age===0?"today":age===1?"yesterday":age+" days ago"}</span></span></span>
      <span class="row" style="gap:6px;flex:none">${incoming ? `<button class="btn primary sm" data-act="payRequest" data-id="${r.id}">Pay</button><button class="btn ghost sm" data-act="declineRequest" data-id="${r.id}">Decline</button>` : r.status==="open" ? `${reqStatusPill(r)}<button class="btn ghost sm" data-act="remindRequest" data-id="${r.id}" ${r.notifyPending?"disabled":""} title="Send another notification">Remind</button><button class="icon-btn" data-act="cancelRequest" data-id="${r.id}" aria-label="Cancel request">${ICONS.x}</button>` : reqStatusPill(r)}</span></div>`; };
  return `<section class="card stack" style="gap:8px"><div class="sec-head"><h3>Payment requests</h3><button class="btn sm" data-act="requestMoney" data-team="${t}">Request money</button></div>
    ${toMe.length?`<div class="small" style="font-weight:600;color:var(--muted)">To you</div>${toMe.map(r=>row(r,true)).join("")}`:""}
    ${mine.length?`<div class="small" style="font-weight:600;color:var(--muted)">Yours</div>${mine.map(r=>row(r,false)).join("")}`:""}</section>`;
}

/* ---------------- Event participation (sign-up) + club-only visibility + club admins managing their club's events ---------------- */
// Who may organise an event: global admins, or a club admin when the event belongs to their club alone.
const canManageEvent = ev => !!ev && (isAdmin() || (evClubs(ev).length===1 && isClubAdmin(evClubs(ev)[0])));
const evRegs = (evId=S.eventId) => (S.allRegs||[]).filter(r=>r.eventId===(evId||"main"));
const isJoined = (pid=uid, evId=S.eventId) => evRegs(evId).some(r=>r.uid===pid);
const signupOpen = ev => !!ev && ev.regOpen!==false && (ev.date||"9999")>=todayISO();
// Players an event is built from: the ones who joined; when nobody has joined yet, every active member (the old behaviour).
function evPool(evId=S.eventId){ const regs=evRegs(evId); if(regs.length) return regs.map(r=>byId(S.players,r.uid)).filter(p=>p&&isActive(p)); return activePlayers(); }
const poolTeam = (t, evId=S.eventId) => evPool(evId).filter(p=>p.team===t);
const usingAllMembers = (evId=S.eventId) => !evRegs(evId).length;
async function joinEvent(pid, evId, by){
  const p=byId(S.players,pid); if(!p) return; const id=`${evId}_${pid}`;
  await store.set("eventRegs", id, {eventId:evId, uid:pid, team:p.team, at:Date.now(), by:by||pid});
  audit("event", `${fullName(p)} joined ${allEvents().find(e=>e.id===evId)?.name||evId}${by&&by!==pid?" (added by "+fullName(me())+")":""}`, {team:p.team, eventId:evId});
}
async function leaveEvent(pid, evId){
  const p=byId(S.players,pid); await store.remove("eventRegs", `${evId}_${pid}`);
  audit("event", `${p?fullName(p):pid} left ${allEvents().find(e=>e.id===evId)?.name||evId}`, {team:p?.team||null, eventId:evId});
}

    ${!regs.length?`<div class="small muted">${open?"Nobody has signed up yet. Until someone does, the organiser's pairs and schedule use all members of the clubs.":"No sign-ups recorded; all members of the clubs count as playing."}</div>`:""}
    <div class="${clubs.length>1?"pairgrid":"stack"}">${clubs.map(col).join("")}</div>
    ${open?`<div class="tiny muted">Sign-up ${ev.regOpen===false?"is closed by the organiser":"closes on the event day"}. Pairs and the schedule are built from the people listed here.</div>`:""}</section>`;
}

/* ---------------- Away mode: long-term absence — auto "Can't" on sessions, no session reminders, visible to the club ---------------- */
const isAway = (p, date) => { if(!p || !p.away || !p.away.from) return false; const d=date||todayISO(); return p.away.from<=d && (!p.away.to || p.away.to>=d); };
const awayLabel = p => p?.away ? (p.away.to ? `away until ${fmtDate(p.away.to)}` : "away until further notice") : "";
// Mark every upcoming session of the club inside the away window as "no" for this member.
async function applyAwayToSessions(pid, away){
  const p=byId(S.players,pid); if(!p) return 0; let n=0;
  for(const s of S.sessions){ if(s.team!==p.team || s.date<todayISO() || s.status==="cancelled") continue;
    const inWin = away && away.from<=s.date && (!away.to || away.to>=s.date); const cur=(s.rsvps||{})[pid];
    if(inWin && cur!=="no"){ const rs={...(s.rsvps||{})}; rs[pid]="no"; const aa={...(s.awayAuto||{})}; aa[pid]=1; await store.update("sessions", s.id, {rsvps:rs, awayAuto:aa, updatedAt:Date.now()}); n++; }
    else if(!inWin && cur==="no" && (s.awayAuto||{})[pid]){ const rs={...(s.rsvps||{})}; delete rs[pid]; const aa={...(s.awayAuto||{})}; delete aa[pid]; await store.update("sessions", s.id, {rsvps:rs, awayAuto:aa, updatedAt:Date.now()}); } }
  return n;
}
function sheetAway(pid){
  const p=byId(S.players,pid||uid); if(!p) return; const a=p.away||{}; const self=p.id===uid;
  openSheet(self?"I'm away":`${p.first} is away`, `<form id="awayForm" class="stack"><p class="small muted" style="margin:0">${self?"While you're away you":"While away, "+esc(p.first)} count${self?"":"s"} as <b>Can't</b> for every session in that period, ${self?"get":"gets"} no session reminders, and the club sees “away”. Payment requests still arrive. ${self?"You can":"They can"} still vote Yes for a single session.</p>
    <div class="row"><label class="f grow">From<input type="date" id="awFrom" required value="${esc(a.from||todayISO())}"></label><label class="f grow">Until (optional)<input type="date" id="awTo" value="${esc(a.to||"")}"></label></div>
    <label class="f">Note for the club (optional)<input id="awNote" maxlength="80" value="${esc(a.note||"")}" placeholder="Travelling · injured · exams"></label></form>`,
    `${p.away?`<button class="btn" data-act="clearAway" data-id="${p.id}" style="flex:0 0 auto">${self?"I'm back":"Back"}</button>`:""}<button class="btn primary" data-act="saveAway" data-id="${p.id}">Save</button>`);
}
function awayBanner(){
  const m=me(); if(!m || !m.away) return "";
  const now=isAway(m); const upcoming=!now && m.away.from>todayISO();
  if(!now && !upcoming) return "";
  return `<div class="banner" style="display:block;background:var(--surface-2,var(--surface));border:1px solid var(--line)"><div class="row spread" style="gap:8px"><span class="small"><b>${now?"You're marked away":"You'll be away from "+esc(fmtDate(m.away.from))}</b>${m.away.to?` until ${esc(fmtDate(m.away.to))}`:" until further notice"}${m.away.note?` · ${esc(m.away.note)}`:""}<br><span class="muted">Sessions in that time are set to “Can't”; no reminders.</span></span><span class="row" style="gap:6px;flex:none"><button class="btn ghost sm" data-act="away">Change</button><button class="btn sm" data-act="clearAway" data-id="${uid}">I'm back</button></span></div></div>`;
}

const VAPID_KEY = "BEp83PZFT1pHb74CA8jrUv9zsXW81I-Dp2IcVHNYy230YI0rBSbFWIfGNouHHTwlLki0o-lgtTD9hvPhJqIAVow";
async function registerPush(interactive){
  if(isDemo){ if(interactive) toast("Notifications need the live app, not the demo"); return; }
  if(!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)){ if(interactive) toast("This browser can't receive notifications. On iPhone, add the app to the Home Screen first."); return; }
  if(!VAPID_KEY || VAPID_KEY.startsWith("__")){ if(interactive) toast("Notifications aren't configured yet"); return; }
  try{
    let perm=Notification.permission; if(perm!=="granted" && interactive) perm=await Notification.requestPermission();
    if(perm!=="granted"){ if(interactive) toast("Notifications are blocked for this app"); return; }
    const base=`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`; const msg=await import(base+"firebase-messaging.js");
    const reg=await navigator.serviceWorker.ready;
    const token=await msg.getToken(msg.getMessaging(S.fbApp), {vapidKey:VAPID_KEY, serviceWorkerRegistration:reg});
    if(!token) throw new Error("no token");
    await store.set("pushTokens", uid, {token, at:Date.now(), ua:navigator.userAgent.slice(0,120)});
    S.pushOn=true; if(interactive){ toast("Notifications on"); render(); }
    msg.onMessage(msg.getMessaging(S.fbApp), p=>{ toast(p.notification?.title||"New notification"); });
  }catch(e){ console.warn(e); if(interactive) toast("Couldn't enable notifications: "+(e.code||e.message)); }
}

/* ---------------- Sheet + toast helpers ---------------- */
function openSheet(title, body, footer){
  $("#sheetHost").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sh"><h2>${esc(title)}</h2><button class="icon-btn" data-act="close" aria-label="Close">${ICONS.x}</button></div><div class="sb">${body}</div>${footer?`<div class="sf">${footer}</div>`:""}</div></div>`;
  const first = $("#sheetHost input:not([type=file]), #sheetHost select"); if(first && window.innerWidth>700) first.focus();
}
function closeSheet(){ $("#sheetHost").innerHTML=""; S._adminAdd=false; render(); }
let toastT; function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2200); }
function confirmSheet(title, text, label, onYes){
  openSheet(title, `<p style="margin:0">${text}</p>`, `<button class="btn" data-act="close">Cancel</button><button class="btn danger" id="confirmYes">${esc(label)}</button>`);
  $("#confirmYes").onclick = async ()=>{ closeSheet(); await onYes(); };
}
const guard = async fn => { try { await fn(); } catch(e){ console.error(e); toast(e?.code==="permission-denied" ? "You don't have permission for that." : "Something went wrong: "+(e.message||e)); } };

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act],[data-tab],[data-val],[data-pm],[data-wo],[data-team],[data-split],[data-invteam],[data-fee]");
  if(!b) { if(e.target.id==="scrim") closeSheet(); return; }

      const data={name:$("#neName").value.trim(), type:$("#neType").value, date:$("#neDate").value, time:$("#neTime").value, venue:$("#neVenue").value.trim(), description:$("#neDesc").value.trim(), courts:+$("#neCourts").value||1, format:$("#neFormat").value, legs:1, matchesPerPlayer:+$("#neMpp").value||3, bestOf:+$("#neBestOf").value||3, pointsTo:21, houseRules:"", createdAt:Date.now(), createdBy:uid||null};
      const clubs=isAdmin()?[...document.querySelectorAll(".neClub:checked")].map(c=>c.value):[myTeam()]; if(!clubs.length){ toast("Pick at least one club"); return; } data.clubs=clubs; data.regOpen=true; if(S._evLogo) data.logo=S._evLogo;
      const id = (data.date+"-"+data.name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")).slice(0,60) + "-" + rnd().slice(0,3);
      await store.set("events", id, data); audit("event", `${data.name} created (${fmtDate(data.date)})`, {team:null, eventId:id}); closeSheet(); toast("Event created"); selectEvent(id); }),
    selectEvent: ()=> selectEvent(id),
    joinEvent: ()=> guard(async ()=>{ if(!signupOpen(S.ev)){ toast("Sign-up is closed"); return; } await joinEvent(uid, S.eventId); toast("You're in"); }),
    leaveEvent: ()=> confirmSheet("Leave event", `Leave <b>${esc(S.ev.name)}</b>? If pairs or a schedule already include you, tell the organiser.`, "Leave", ()=>guard(async ()=>{ await leaveEvent(uid, S.eventId); })),
    joinFor: ()=> guard(async ()=>{ const p=byId(S.players,id); if(!p || !(canManageEvent(S.ev)||isClubAdmin(p.team))) return; await joinEvent(id, S.eventId, uid); toast(`${p.first} added`); }),
    unjoin: ()=> guard(async ()=>{ const p=byId(S.players,id); if(!p || !(canManageEvent(S.ev)||isClubAdmin(p.team))) return; await leaveEvent(id, S.eventId); toast(`${p.first} removed`); }),
    openEvent: ()=>{ S.eventId=id; lsSet("ppc_event", id); S.pick=[]; recomputeEvent(); window.refreshScopedSubs?.(); S.tab="event"; render(); },
    delEvent: ()=> confirmSheet("Delete event", `Delete <b>${esc(S.ev.name)}</b> with its pairs, schedule and challenge-day costs?`, "Delete event", ()=>guard(async ()=>{
      for(const m of S.matches) await store.remove("matches", m.id); for(const p of S.pairs) await store.remove("pairs", p.id);
      for(const e of S.expenses.filter(e=>(!e.scope||e.scope==="event") && inEv(e))) await store.remove("expenses", e.id);
      audit("event", `${S.ev.name} deleted`, {team:null}); await store.remove("events", S.eventId); S.eventId=null; recomputeEvent(); render(); })),
    pick: ()=>{ const p=byId(S.players,id); let pk=(S.pick||[]).filter(x=>byId(S.players,x)?.team===p.team); if(pk.includes(id)) pk=pk.filter(x=>x!==id); else pk.push(id); S.pick=pk.slice(-2); render(); },
    makePair: ()=> guard(async ()=>{ const ps=(S.pick||[]).map(x=>byId(S.players,x)).filter(Boolean); if(ps.length!==2) return; await store.set("pairs", store.newId(), {eventId:S.eventId, team:ps[0].team, players:ps.map(p=>p.id), order:S.pairs.filter(p=>p.team===ps[0].team).length, createdAt:Date.now()}); S.pick=[]; toast("Pair created"); }),
    delPair: ()=> guard(async ()=>{ const used=S.matches.some(m=>m.pairA===id||m.pairB===id); if(used){ confirmSheet("Pair is scheduled", "This pair has matches in the schedule. Removing it deletes those matches.", "Remove pair and matches", async ()=>{ for(const m of S.matches.filter(m=>m.pairA===id||m.pairB===id)) await store.remove("matches", m.id); await store.remove("pairs", id); }); } else await store.remove("pairs", id); }),
    autoPair: ()=> guard(async ()=>{ const t=b.dataset.team; const free=poolTeam(t).filter(p=>!S.pairs.some(x=>(x.players||[]).includes(p.id))); const groups=autoPairs(free, b.dataset.mode).filter(g=>g.length===2); let order=S.pairs.filter(p=>p.team===t).length; for(const g of groups){ await store.set("pairs", store.newId(), {eventId:S.eventId, team:t, players:g.map(p=>p.id), order:order++, createdAt:Date.now()}); } toast(`${groups.length} pair${groups.length===1?"":"s"} made${free.length%2?" · 1 player left over":""}`); }),
    clearPairs: ()=> confirmSheet("Clear pairs", "Remove all pairs? The schedule is cleared too.", "Clear", ()=>guard(async ()=>{ await clearEv("matches"); await clearEv("pairs"); })),
    genFixtures: ()=>{ const go = async ()=> guard(async ()=>{
        if(S.event.format==="rotation"){
          const A=poolTeam("A"), B=poolTeam("B");
          const res=buildRotation(A,B,projectFixtures().total,S.event.courts||1);
          await clearEv("matches"); await clearEv("pairs");
          const ids={}; let order=0; for(const [k,pr] of Object.entries(res.pairs)){ const id=store.newId(); ids[k]=id; await store.set("pairs", id, {...pr, eventId:S.eventId, order:order++, auto:true, createdAt:Date.now()}); }
          for(const m of res.matches){ const {pairKeyA,pairKeyB,...rest}=m; await store.set("matches", store.newId(), {...rest, eventId:S.eventId, pairA:ids[pairKeyA], pairB:ids[pairKeyB], createdAt:Date.now()}); }
          audit("schedule", `${S.ev.name}: ${res.matches.length} rotation matches generated`, {team:null, eventId:S.eventId}); toast(`${res.matches.length} matches scheduled`); S.tab="matches"; render(); return;
        }
        const pa=S.pairs.filter(p=>p.team==="A"&&p.players?.length===2).sort((a,b)=>(a.order||0)-(b.order||0)), pb=S.pairs.filter(p=>p.team==="B"&&p.players?.length===2).sort((a,b)=>(a.order||0)-(b.order||0)); const fx=buildFixtures(pa,pb,S.event.legs||1,S.event.courts||1); await clearEv("matches"); for(const m of fx) await store.set("matches", store.newId(), {...m, eventId:S.eventId, createdAt:Date.now()}); audit("schedule", `${S.ev.name}: ${fx.length} matches generated`, {team:null, eventId:S.eventId}); toast(`${fx.length} matches scheduled`); S.tab="matches"; render(); });
      if(S.matches.length) confirmSheet("Regenerate schedule", `This replaces the current ${S.matches.length} matches and any scores entered.`, "Regenerate", go); else go(); },
    clearMatches: ()=> confirmSheet("Clear schedule", "Delete all matches and scores?", "Clear", ()=>guard(async ()=>{ audit("schedule", `${S.ev.name}: schedule cleared (${S.matches.length} matches)`, {team:null, eventId:S.eventId}); await clearEv("matches"); })),
    addMatch: sheetAddMatch,
    saveNewMatch: ()=> guard(async ()=>{ await store.set("matches", store.newId(), {eventId:S.eventId, pairA:$("#amA").value, pairB:$("#amB").value, round:+$("#amRound").value||1, court:+$("#amCourt").value||1, leg:1, order:S.matches.length, games:[], walkover:null, status:"scheduled", createdAt:Date.now()}); closeSheet(); toast("Match added"); }),
    addAdmin: ()=> guard(async ()=>{ const v=$("#newAdmin").value; if(!v) return; await store.update("settings","admins",{uids:[...new Set([...(S.admins?.uids||[]), v])]}); audit("admin", `${fullName(byId(S.players,v))} made admin`, {team:null}); toast("Admin added"); }),
    rmAdmin: ()=> guard(async ()=>{ await store.update("settings","admins",{uids:(S.admins?.uids||[]).filter(u=>u!==id)}); audit("admin", `${fullName(byId(S.players,id))||id.slice(0,8)} removed as admin`, {team:null}); }),
    claimAdmin: ()=> guard(async ()=>{ await store.set("settings","admins",{uids:[uid], createdAt:Date.now()}); toast("You're the admin"); }),
    seed: ()=> guard(seedDemo),
    resetDemo: ()=> confirmSheet("Reset demo", "Delete all demo data on this device?", "Reset", ()=>store.reset()),
  };
  A[act]?.();
});
document.addEventListener("change", async e => {
  if(e.target.id==="clubLogoInput" && e.target.files[0]){ try{ S._clubLogo = await shrinkPhoto(e.target.files[0], 256, 60000); $("#clubLogoPreview").innerHTML=`<img class="avatar lg" style="border-radius:14px" src="${S._clubLogo}" alt="">`; }catch(err){ toast("Couldn't read that image"); } }
  if(e.target.id==="evLogoInput" && e.target.files[0]){ try{ S._evLogo = await shrinkPhoto(e.target.files[0], 480, 110000); $("#evLogoPreview").innerHTML=`<img class="avatar lg" style="border-radius:14px" src="${S._evLogo}" alt="">`; }catch(err){ toast("Couldn't read that image"); } }
  if(e.target.id==="photoInput" && e.target.files[0]){ try{ S._photo = await shrinkPhoto(e.target.files[0]); $("#photoPreview").innerHTML=`<img class="avatar lg" src="${S._photo}" alt="">`; }catch(err){ toast("Couldn't read that image"); } }
  if(e.target.id==="evSwitch"){ selectEvent(e.target.value); }
  if(e.target.id==="tPot"){ const box=$("#splitBox"); if(box) box.hidden=e.target.checked; }

  if(e.target.dataset.act==="toggleInvite"){ const pid=e.target.dataset.id, v=e.target.checked; guard(async ()=>{ await store.update("players", pid, {canInvite:v, updatedAt:Date.now()}); audit("role", `${fullName(byId(S.players,pid))} ${v?"may invite":"invite right removed"}`, {team:byId(S.players,pid)?.team}); toast(v?"Can now invite players":"Invite right removed"); }); }
  if(e.target.id==="demoAdminToggle"){ S.demoAdmin=e.target.checked; lsSet("ppc_demo_admin", S.demoAdmin); render(); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });
$("#meBtn").addEventListener("click", ()=>{ const m=me(); m ? sheetPlayer(m.id) : sheetProfile(null); });
document.addEventListener("submit", e=> e.preventDefault());

/* ---------------- Boot ---------------- */
async function migrateEvents(){
  if(!isAdmin() || !store) return;
  for(const ev of S.events){ if(!Array.isArray(ev.clubs) || !ev.clubs.length){ try{ await store.update("events", ev.id, {clubs:["A","B"]}); }catch(e){ console.warn(e); } } }
  if(S.events.length || S._migrated) return; S._migrated=true;
  const ev=allEvents()[0]; const {id, virtual, ...data}=ev;
  try{ await store.set("events", "main", {...data, clubs:["A","B"], type:data.type||"challenge", createdAt:Date.now()}); }catch(e){ console.warn(e); }
}
async function boot(){
  view.innerHTML = `<div class="empty"><b>Loading…</b>Connecting to Badminton Berlin.</div>`;
  try{
    if(isDemo){ store = makeDemoStore(); uid = lsGet(uidKey()) || (lsSet(uidKey(), rnd()), lsGet(uidKey())); }
    else store = await makeFirebaseStore();
  }catch(e){ console.error(e); view.innerHTML = `<div class="empty"><b>Can't connect</b>${esc(e.message||e)}<br><span class="small">Check the Firebase config and that Anonymous sign-in is enabled.</span></div>`; return; }
  let first = true;
  const ready = {};
  const after = ()=>{ refreshScopedSubs(); if(Object.keys(ready).length>=2 || !first) { first=false; if(!$("#sheetHost").children.length) render(); else renderTabs(); } };
  const sub = (c, fn)=> store.subscribe(c, rows => { fn(rows); ready[c]=true; after(); });
  S.scoped = {}; S.scopedData = {eventExpenses:[], teamExpenses:[]};
  const resub = (name, col, filter, fn)=>{ S.scoped[name]?.(); S.scoped[name]=null; if(filter===false){ fn([]); return; } S.scoped[name]=store.subscribe(col, rows=>{ fn(rows); after(); }, filter); };
  // Subscriptions whose query depends on who is reading (club, admin) and which event is selected.
  // The Firestore rules only allow exactly these queries, so a member never receives another club's data.
  window.refreshScopedSubs = function(){
    const inactive = amInactive(); const t = inactive ? null : myTeam(), adm=isAdmin(); const key1=JSON.stringify([t,adm,canInvite(),inactive]);
    // Clubs whose members I may see: my own, plus any club that shares an event with mine (the challenge).
    const visible = adm ? null : t ? [...new Set([t, ...S.events.flatMap(ev=>evClubs(ev))])].sort() : (myTeam() ? [myTeam()] : false);
    const keyP=JSON.stringify([adm, visible]);
    if(S._scopeP!==keyP){ S._scopeP=keyP; resub("players","players", adm ? null : visible ? {field:"team", op:"in", value:visible} : false, rows=>{ S.scopedData.players=rows; window.mergePlayers?.(); }); if(adm) syncSharing(); }
    if(S._scope1!==key1){ S._scope1=key1;
      resub("events","events", adm ? null : t ? {field:"clubs", op:"array-contains", value:t} : false, rows=>{ S.events=rows; recomputeEvent(); setTimeout(migrateEvents, 800); if(isAdmin()) syncSharing(); });
      resub("sessions","sessions", adm ? null : t ? {field:"team", op:"==", value:t} : false, rows=>{ S.sessions=rows; setTimeout(ensureNextSessions, 500); });
      resub("teams","teams", adm ? null : t ? {id:t} : false, rows=>{ S.teams=rows; setTimeout(ensureNextSessions, 500); });
      resub("invites","invites", adm ? null : (t && canInvite()) ? {field:"createdBy", op:"==", value:uid} : false, rows=>{ S.invites=rows; });
      resub("audit","audit", adm ? null : (t && isClubAdmin(t)) ? {field:"team", op:"==", value:t} : false, rows=>{ S.audit=rows; });
      resub("seasons","seasons", adm ? null : t ? {field:"clubs", op:"array-contains", value:t} : false, rows=>{ S.seasons=rows; });
      const mergeReq=()=>{ const seen=new Set(); onRequestsUpdate([...(S.scopedData.reqTo||[]),...(S.scopedData.reqFrom||[])].filter(r=>!seen.has(r.id)&&seen.add(r.id))); };
      if(adm){ ["reqTo","reqFrom"].forEach(k=>{ S.scoped[k]?.(); S.scoped[k]=null; }); resub("reqAll","requests", null, rows=>onRequestsUpdate(rows)); }
      else { S.scoped.reqAll?.(); S.scoped.reqAll=null; resub("reqTo","requests", uid?{field:"to", op:"==", value:uid}:false, rows=>{ S.scopedData.reqTo=rows; mergeReq(); }); resub("reqFrom","requests", uid?{field:"from", op:"==", value:uid}:false, rows=>{ S.scopedData.reqFrom=rows; mergeReq(); }); }
      const mergeOwn = ()=>{ const seen=new Set(); S.scopedData.teamExpenses=[...(S.scopedData.own1||[]),...(S.scopedData.own2||[]),...(S.scopedData.own3||[]),...(S.scopedData.own4||[])].filter(e=> e.scope==="team" && !seen.has(e.id) && seen.add(e.id)); S.expenses=[...S.scopedData.eventExpenses, ...S.scopedData.teamExpenses]; };
      if(inactive){ // an inactive member keeps read access to the costs and payments they are part of
        resub("teamExpenses","expenses", false, ()=>{});
        resub("own1","expenses", {field:"splitAmong", op:"array-contains", value:uid}, rows=>{ S.scopedData.own1=rows; mergeOwn(); });
        resub("own2","expenses", {field:"paidBy", op:"==", value:uid}, rows=>{ S.scopedData.own2=rows; mergeOwn(); });
        resub("own3","expenses", {field:"from", op:"==", value:uid}, rows=>{ S.scopedData.own3=rows; mergeOwn(); });
        resub("own4","expenses", {field:"to", op:"==", value:uid}, rows=>{ S.scopedData.own4=rows; mergeOwn(); });
      } else {
        ["own1","own2","own3","own4"].forEach(k=>{ S.scoped[k]?.(); S.scoped[k]=null; S.scopedData[k]=[]; });
        resub("teamExpenses","expenses", adm ? {field:"scope", op:"==", value:"team"} : t ? {field:"team", op:"==", value:t} : false, rows=>{ S.scopedData.teamExpenses=rows.filter(e=>e.scope==="team"); S.expenses=[...S.scopedData.eventExpenses, ...S.scopedData.teamExpenses]; });
      }
    }
    const ids = (!!(t||adm)) ? allEvents().map(e=>e.id).slice(0,12) : []; const key2=JSON.stringify(ids);
    if(S._scope2!==key2){ S._scope2=key2; S.evData ||= {};
      // drop subscriptions of events no longer visible
      Object.keys(S.evData).filter(id=>!ids.includes(id)).forEach(id=>{ ["pairs","matches","exp","regs"].forEach(k=>{ S.scoped[k+":"+id]?.(); S.scoped[k+":"+id]=null; }); delete S.evData[id]; });
      const mergeEv = ()=>{ S.allPairs=[].concat(...Object.values(S.evData).map(d=>d.pairs||[])); S.allMatches=[].concat(...Object.values(S.evData).map(d=>d.matches||[])); S.scopedData.eventExpenses=[].concat(...Object.values(S.evData).map(d=>d.exp||[])).filter(e=>e.scope!=="team"); S.expenses=[...S.scopedData.eventExpenses, ...S.scopedData.teamExpenses]; S.allRegs=[].concat(...Object.values(S.evData).map(d=>d.regs||[])); recomputeEvent(); };
      ids.forEach(id=>{ S.evData[id] ||= {};
        if(!S.scoped["regs:"+id]) resub("regs:"+id,"eventRegs", {field:"eventId", op:"==", value:id}, rows=>{ S.evData[id].regs=rows; mergeEv(); });
        if(!S.scoped["pairs:"+id]) resub("pairs:"+id,"pairs", {field:"eventId", op:"==", value:id}, rows=>{ S.evData[id].pairs=rows; mergeEv(); });
        if(!S.scoped["matches:"+id]) resub("matches:"+id,"matches", {field:"eventId", op:"==", value:id}, rows=>{ S.evData[id].matches=rows; mergeEv(); });
        if(!S.scoped["exp:"+id]) resub("exp:"+id,"expenses", {field:"eventId", op:"==", value:id}, rows=>{ S.evData[id].exp=rows; mergeEv(); }); });
      if(!ids.length){ S.allPairs=[]; S.allMatches=[]; S.allRegs=[]; S.scopedData.eventExpenses=[]; S.expenses=[...S.scopedData.teamExpenses]; recomputeEvent(); }
    }
  };
  sub("settings", rows => { const ev=rows.find(r=>r.id==="event"); S.settingsEvent = ev ? (({id,...r})=>r)(ev) : null; S.admins = rows.find(r=>r.id==="admins")||null; const sh=rows.find(r=>r.id==="sharing"); S.sharingDoc = sh ? (({id,...r})=>r)(sh) : {}; S.adminsLoaded=true; recomputeEvent(); });
  // Own profile first (needed to know the club), then the club's members — see refreshScopedSubs.
  S.scopedData.me=[]; S.scopedData.players=[];
  const mergePlayers=()=>{ const seen=new Set(); S.players=[...S.scopedData.me, ...S.scopedData.players].filter(p=>!seen.has(p.id)&&seen.add(p.id)); };
  window.mergePlayers=mergePlayers;
  if(uid) resub("me","players",{id:uid}, rows=>{ S.scopedData.me=rows; mergePlayers(); ready.me=true; }); else { S.players=[]; ready.me=true; }
  if(location.hash==="#sessions") S.tab="sessions";
  pickupInviteFromUrl(); setTimeout(loadPendingInvite, 1500);
  if(lsGet("ppc_noLink", false)){ S._noLinkHint=true; lsSet("ppc_noLink", false); }
  if(lsGet("ppc_restored", false)){ lsSet("ppc_restored", false); setTimeout(()=>{ if(me()) toast(`Welcome back, ${me().first}!`); }, 2500); }
  if(!isDemo && "Notification" in window && Notification.permission==="granted") setTimeout(()=>registerPush(false), 2000);
  setTimeout(()=>{ if(first){ first=false; render(); } }, 3000);
  let lastScroll=0; view.addEventListener("scroll", ()=>{ lastScroll=Date.now(); }, {passive:true});
  setInterval(()=>{ if(S.tab==="home" && !$("#sheetHost").children.length && Date.now()-lastScroll>3000) render(); }, 60000);
  if("serviceWorker" in navigator && !isDemo && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
}
// Admin bootstrap banner (Firebase only): first opener can claim admin when no admins doc exists.
const _render = render; render = function(){ _render(); if(!isDemo && S.adminsLoaded && !S.admins && S.tab==="home"){ view.insertAdjacentHTML("afterbegin", `<div class="banner"><span class="grow">No organiser yet. Are you setting this up?</span><button class="btn primary" data-act="claimAdmin">Claim admin</button></div>`); } };
boot();
</script>
