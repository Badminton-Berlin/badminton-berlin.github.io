<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1208">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Badminton">
<meta name="description" content="Registration, pairs, schedule, scores and expenses for the Lichtenrade/Lankwitz (LL) vs Spandau/Staaken (SP) badminton challenge.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Preussenpark Challenge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen phone app; sticky header, scrolling content, fixed bottom tab bar; sheets slide up for forms. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --surface-2:#e9ebe6; --fg:#171a17; --muted:#5d645e; --line:#d6d9d2;
  --accent:#e8761a; --accent-ink:#1a1208;
  --team-a:#d9640f; --team-a-soft:#fbe5d2; --team-b:#1497c8; --team-b-soft:#d6eef8;
  --good:#1d7a3a; --warn:#b26a00; --bad:#b5312c;
  --shadow:0 8px 24px rgba(20,30,20,.10);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1721; --surface:#18222e; --surface-2:#212d3b; --fg:#eef0ea; --muted:#9aa5b1; --line:#2b3745;
  --accent:#ff8c2e; --accent-ink:#1a1208;
  --team-a:#ff8c2e; --team-a-soft:#3d2410; --team-b:#2ec1f0; --team-b-soft:#0f2e42;
  --good:#58c47a; --warn:#e5a53a; --bad:#ef7a73; --shadow:0 8px 24px rgba(0,0,0,.45); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1721; --surface:#18222e; --surface-2:#212d3b; --fg:#eef0ea; --muted:#9aa5b1; --line:#2b3745;
  --accent:#ff8c2e; --accent-ink:#1a1208;
  --team-a:#ff8c2e; --team-a-soft:#3d2410; --team-b:#2ec1f0; --team-b-soft:#0f2e42;
  --good:#58c47a; --warn:#e5a53a; --bad:#ef7a73; --shadow:0 8px 24px rgba(0,0,0,.45); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-display);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;font-weight:800}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#app{height:100%;display:flex;flex-direction:column}
header.top .actions{display:flex;gap:2px;flex:none}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
header.top .logo{width:44px;height:44px;border-radius:10px;flex:none}
header.top .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
main{flex:1;overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(90px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600;border-radius:10px;min-width:0}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row>*{min-width:0}
.spread{justify-content:space-between}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-head h3{margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 10px;min-height:34px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:0;background:none;padding:6px;border-radius:10px;color:var(--muted);display:inline-flex}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;font-weight:400;color:var(--fg);width:100%;min-height:44px}
label.f textarea{min-height:70px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;font-weight:500;font-size:15px;padding:6px 0}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.help{font-size:12px;color:var(--muted);font-weight:400}

.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 6px;font-weight:600;font-size:14px;color:var(--muted);min-width:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.A[aria-pressed="true"]{color:var(--team-a)}
.seg button.B[aria-pressed="true"]{color:var(--team-b)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.A{background:var(--team-a-soft);color:var(--team-a)}
.pill.B{background:var(--team-b-soft);color:var(--team-b)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.live{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}

.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--surface-2);flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--muted);border:2px solid var(--surface)}
.avatar.lg{width:88px;height:88px;font-size:30px}
.avatar.sm{width:30px;height:30px;font-size:12px}
.avatar.A{border-color:var(--team-a)} .avatar.B{border-color:var(--team-b)}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.hero .hero-logo{width:100%;max-width:320px;aspect-ratio:1;border-radius:12px;justify-self:center}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:14px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.vs .team{display:flex;flex-direction:column;gap:2px;min-width:0}
.vs .team.b{text-align:right;align-items:flex-end}
.vs .tname{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.1;overflow-wrap:anywhere}
.vs .score{font-family:var(--f-display);font-weight:800;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.vs .team.a .score,.vs .team.a .tname{color:var(--team-a)} .vs .team.b .score,.vs .team.b .tname{color:var(--team-b)}
.vs .dash{font-family:var(--f-display);font-size:26px;color:var(--muted);font-weight:600}
.countdown{display:flex;gap:8px}
.countdown div{flex:1;background:var(--surface-2);border-radius:10px;padding:8px 4px;text-align:center}
.countdown b{display:block;font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.countdown span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;color:inherit;min-width:0}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{display:block;font-size:13px;color:var(--muted)}
.item .amt{font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.item.sel{background:var(--team-a-soft)}
.item.sel.B{background:var(--team-b-soft)}

.match{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;width:100%;text-align:left;color:inherit}
.match .hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.match .side{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}
.match .side .names{display:flex;align-items:center;gap:6px;min-width:0;font-weight:600}
.match .side .names span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match .side .names .stripe{width:4px;height:22px;border-radius:2px;flex:none}
.match .side.A .stripe{background:var(--team-a)} .match .side.B .stripe{background:var(--team-b)}
.match .side.win .names{color:var(--fg)} .match .side.lose .names{color:var(--muted)}
.match .games{display:flex;gap:6px}
.match .games b{font-family:var(--f-display);font-size:20px;font-weight:700;min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.match .games b.w{color:var(--fg)} .match .games b.l{color:var(--muted);font-weight:500}
.match.mine{border-color:var(--accent)}
.round-h{display:flex;align-items:center;gap:10px;margin-top:4px}
.round-h h3{white-space:nowrap}
.round-h::after{content:"";flex:1;height:1px;background:var(--line)}

.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--line);font-weight:600}
.table td{padding:8px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.table td:first-child,.table th:first-child{padding-left:2px}.table td:last-child,.table th:last-child{padding-right:2px}
.table tr:last-child td{border-bottom:0}
.table td.n{text-align:right;font-family:var(--f-display);font-size:17px;font-weight:600}
.table th.n{text-align:right}
.scroll-x{overflow-x:auto}

.pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pairbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.pairbox.A{border-top:4px solid var(--team-a)} .pairbox.B{border-top:4px solid var(--team-b)}
.pairbox .pname{font-family:var(--f-display);font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pairbox .p{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-width:0}
.pairbox .p span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pairbox .x{position:absolute;top:6px;right:6px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}

.empty{text-align:center;color:var(--muted);padding:28px 16px;border:1px dashed var(--line);border-radius:var(--r);font-size:15px}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:20px;margin-bottom:4px}
.banner{background:var(--team-b-soft);color:var(--team-b);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.banner.info{background:var(--team-a-soft);color:var(--team-a)}
.banner .btn{min-height:32px;padding:4px 10px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;box-shadow:var(--shadow);max-width:calc(100vw - 32px);text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(10,14,10,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out;box-shadow:var(--shadow)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet .sb{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .sf{display:flex;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--bg)}
.sheet .sf .btn{flex:1}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:90%}}

.photo-pick{display:flex;align-items:center;gap:14px}
.photo-pick input{position:absolute;opacity:0;width:1px;height:1px}
.scorebox{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.scorebox .sc{display:flex;flex-direction:column;align-items:center;gap:4px}
.scorebox input{width:84px;text-align:center;font-family:var(--f-display);font-size:38px;font-weight:800;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:6px;min-height:60px;font-variant-numeric:tabular-nums}
.scorebox .pm{display:flex;gap:6px}
.scorebox .pm button{width:40px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:600}
.glabel{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:center}
.balance.pos{color:var(--good)} .balance.neg{color:var(--bad)}
.demo{background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.demo .check{padding:0;font-size:12px}
.demo .check input{width:16px;height:16px}
code.uid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--surface-2);padding:3px 6px;border-radius:6px;overflow-wrap:anywhere}
.lead{font-size:15px;color:var(--muted);max-width:60ch}
.map{height:170px;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.map:empty{display:none}
a.lnk{color:var(--accent);font-weight:600;text-decoration:none}
</style>

<div id="app">

function recomputeEvent(){
  const evs=allEvents(); let ev=evs.find(e=>e.id===S.eventId);
  if(!ev){ const t=todayISO(); ev = evs.filter(e=>e.date>=t).sort((a,b)=>a.date.localeCompare(b.date))[0] || [...evs].sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0]; S.eventId=ev?ev.id:null; }
  if(!ev){ ev={id:null, name:"", clubs:[], type:"challenge"}; }
  S.ev=ev; S.event={...DEFAULT_EVENT, ...pick(S.settingsEvent||{},GLOBAL_KEYS), ...pick(ev,EVENT_KEYS)};
  S.pairs=S.allPairs.filter(inEv); S.matches=S.allMatches.filter(inEv);
}
function selectEvent(id){ S.eventId=id; lsSet("ppc_event", id); S.pick=[]; recomputeEvent(); window.refreshScopedSubs?.(); render(); }

/* ---------------- Store abstraction (Firebase or local demo) ---------------- */
const COLS = ["players","pairs","matches","expenses","settings","sessions","teams","pushTokens","events","invites"];
let store, uid = null, isDemo = !FIREBASE_CONFIG;

function uidKey(){ return "ppc_uid"; }
function rnd(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function lsGet(k,d){ try{ const v = localStorage.getItem(k); return v==null? d : JSON.parse(v);}catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

function makeDemoStore(){
  const KEY = "ppc_demo_v1";
  let data = lsGet(KEY, null) || Object.fromEntries(COLS.map(c=>[c,{}]));
  const subs = {};
  const save = ()=> lsSet(KEY, data);
  const notify = c => (subs[c]||[]).forEach(fn => fn());
  return {
    subscribe(c, fn, filter){ const sel=()=> Object.entries(data[c]).map(([id,d])=>({id,...d})).filter(r=> !filter ? true : filter.id ? r.id===filter.id : filter.op==="array-contains" ? (Array.isArray(r[filter.field]) && r[filter.field].includes(filter.value)) : r[filter.field]===filter.value); const h=()=>fn(sel()); (subs[c] ||= []).push(h); h(); return ()=>{ subs[c]=subs[c].filter(f=>f!==h); }; },
    async set(c,id,d){ data[c][id] = JSON.parse(JSON.stringify(d)); save(); notify(c); },
    async get(c,id){ return data[c][id] ? JSON.parse(JSON.stringify(data[c][id])) : null; },
    async update(c,id,p){ data[c][id] = {...(data[c][id]||{}), ...JSON.parse(JSON.stringify(p))}; save(); notify(c); },
    async remove(c,id){ delete data[c][id]; save(); notify(c); },
    async removeAll(c){ data[c] = {}; save(); notify(c); },
    newId: rnd,
    async reset(){ data = Object.fromEntries(COLS.map(c=>[c,{}])); save(); COLS.forEach(notify); }
  };
}

async function makeFirebaseStore(){
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  const [{initializeApp}, auth, fs] = await Promise.all([
    import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js")
  ]);
  const app = initializeApp(FIREBASE_CONFIG); S.fbApp = app;
  const a = auth.getAuth(app);
  await auth.setPersistence(a, auth.browserLocalPersistence).catch(()=>{});
  const cred = await new Promise((res, rej)=>{
    const off = auth.onAuthStateChanged(a, u => { if(u){ off(); res(u); } else auth.signInAnonymously(a).catch(rej); }, rej);
  });
  uid = cred.uid;
  const db = fs.getFirestore(app);
  try { fs.enableIndexedDbPersistence && await fs.enableIndexedDbPersistence(db); } catch(e){}
  const strip = d => JSON.parse(JSON.stringify(d));
  return {
    subscribe(c, fn, filter){
      let q=fs.collection(db,c); if(filter){ q = filter.id ? fs.query(q, fs.where(fs.documentId(),"==",filter.id)) : fs.query(q, fs.where(filter.field, filter.op, filter.value)); }
      // A listener that is refused (e.g. opened a moment before the server stored the registration) is retried instead of left dead.
      let unsub=null, stopped=false, attempt=0;
      const start=()=>{ unsub=fs.onSnapshot(q, snap => { attempt=0; fn(snap.docs.map(d=>({id:d.id, ...d.data()}))); }, err => { console.warn("listen", c, err.code); if(stopped) return; if(err.code==="permission-denied" && attempt<8){ attempt++; setTimeout(()=>{ if(!stopped) start(); }, 1200*attempt); } else toast("Could not load "+c+": "+err.code); }); };
      start(); return ()=>{ stopped=true; if(unsub) unsub(); };
    },
    set:(c,id,d)=> fs.setDoc(fs.doc(db,c,id), strip(d)),
    async get(c,id){ const d=await fs.getDoc(fs.doc(db,c,id)); return d.exists()? d.data() : null; },
    update:(c,id,p)=> fs.setDoc(fs.doc(db,c,id), strip(p), {merge:true}),
    remove:(c,id)=> fs.deleteDoc(fs.doc(db,c,id)),
    async removeAll(c){ const snap = await fs.getDocs(fs.collection(db,c)); const b = fs.writeBatch(db); snap.docs.forEach(d=>b.delete(d.ref)); await b.commit(); },
    newId: ()=> fs.doc(fs.collection(db,"_ids")).id,
    reset: null
  };
}

/* ---------------- Game logic ---------------- */
function gameWinner(g){ const [a,b]=g.map(x=>+x||0), T=S.event.pointsTo||21, cap=T+9; if(a===b) return null; const hi=Math.max(a,b), lo=Math.min(a,b); if(hi<T) return null; if(hi-lo>=2 || hi>=cap) return a>b?"A":"B"; return null; }
function matchResult(m){
  const need = Math.ceil((S.event.bestOf||3)/2); let wa=0, wb=0;
  for(const g of (m.games||[])){ const w=gameWinner(g); if(w==="A") wa++; else if(w==="B") wb++; }
  const winner = m.walkover || (wa>=need ? "A" : wb>=need ? "B" : null);
  return {wa, wb, winner, done: !!winner};
}
function pairPlayers(pr){ return (pr?.players||[]).map(id=>byId(S.players,id)).filter(Boolean); }
function pairLabel(pr){ if(!pr) return "—"; const ps = pairPlayers(pr); return ps.length ? ps.map(p=>p.first).join(" & ") : (pr.name||"Pair"); }
function autoPairs(players, mode){
  const ps = [...players];
  if(mode==="random"){ for(let i=ps.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ps[i],ps[j]]=[ps[j],ps[i]]; } return chunk2(ps); }
  if(mode==="balanced"){ ps.sort((a,b)=> (a.dob||"9999") < (b.dob||"9999") ? -1 : 1); const out=[]; let i=0, j=ps.length-1; while(i<j){ out.push([ps[i],ps[j]]); i++; j--; } if(i===j) out.push([ps[i]]); return out; }
  return chunk2(ps);
}
function chunk2(ps){ const out=[]; for(let i=0;i<ps.length;i+=2) out.push(ps.slice(i,i+2)); return out; }
function buildFixtures(pairsA, pairsB, legs, courts){
  // Bipartite round-robin: every A pair meets every B pair once per leg, and no pair plays twice in a round.
  const nA=pairsA.length, nB=pairsB.length, L=Math.max(nA,nB); const rounds=[];
  for(let leg=1; leg<=legs; leg++) for(let s=0; s<L; s++){
    const r=[]; for(let i=0;i<L;i++){ const j=(i+s)%L; if(i<nA && j<nB) r.push({pairA:pairsA[i].id, pairB:pairsB[j].id, leg}); }
    // courts limit: split a logical round into as many rounds as needed
    for(let k=0;k<r.length;k+=Math.max(1,courts)) rounds.push(r.slice(k,k+Math.max(1,courts)));
  }
  const out=[]; rounds.forEach((r,ri)=> r.forEach((m,ci)=> out.push({...m, round:ri+1, court:ci+1, order:out.length, games:[], walkover:null, status:"scheduled"})));
  return out;
}
function buildRotation(A, B, M, courts){
  // Davis Cup style rotation: M matches in rounds; in each round as many matches as both teams can field,
  // partners (same team) and opponents rotate, and players with the fewest matches always play first,
  // so when 2M divides evenly by the team size everyone in that team ends on exactly the same count.
  const per = Math.min(Math.floor(A.length/2), Math.floor(B.length/2)); if(!per || !M) return {pairs:{}, matches:[]};
  const played={}, partner={}, faced={}, pairs={};
  const key=(x,y)=> x<y ? x+"|"+y : y+"|"+x;
  const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  let m = per;
  const pick = team => shuffle([...team]).sort((a,b)=>(played[a.id]||0)-(played[b.id]||0)).slice(0,2*m);
  const matchings = ps => { // all perfect matchings of ps (≤12 players)
    if(!ps.length) return [[]]; const [h,...rest]=ps, out=[];
    for(let i=0;i<rest.length;i++){ const others=rest.filter((_,j)=>j!==i); for(const mm of matchings(others)) out.push([[h,rest[i]],...mm]); }
    return out; };
  const pairUp = ps => { let best=null, bc=Infinity; for(const mm of shuffle(matchings(ps))){ const c=mm.reduce((t,[x,y])=>t+(partner[key(x.id,y.id)]||0)**2,0); if(c<bc){bc=c;best=mm;} } return best; };
  const perms = a => a.length<=1 ? [a] : a.flatMap((x,i)=> perms([...a.slice(0,i),...a.slice(i+1)]).map(p=>[x,...p]));
  const rounds=[];
  const grow=f=> f? 3**f-1 : 0; // repeating the same person twice costs far more than once
  const oppCost=(pa,pb)=>{ let c=0; pa.forEach((x,i)=> x.forEach(p=> pb[i].forEach(q=> c+=grow(faced[key(p.id,q.id)])))); return c; };
  const partCost=mm=> mm.reduce((t,[x,y])=>t+grow(partner[key(x.id,y.id)]),0);
  let left=M;
  while(left>0){
    m = Math.min(per, left); left -= m;
    const sa=pick(A), sb=pick(B); let pa, best;
    if(m<=4){ // joint search over pairings of both teams and opponent assignment (partner repeats cost double)
      let bc=Infinity; const MA=shuffle(matchings(sa)), MB=shuffle(matchings(sb));
      for(const ma of MA){ const ca=partCost(ma)*2; if(ca>bc) continue; for(const mb of MB){ const cb=ca+partCost(mb)*2; if(cb>bc) continue; for(const perm of perms(mb)){ const c=cb+oppCost(ma,perm); if(c<bc){bc=c;pa=ma;best=perm;} } } }
    } else {
      pa=pairUp(sa); const pb=pairUp(sb); let bc=Infinity;
      for(const perm of shuffle(perms(pb))){ const c=oppCost(pa,perm); if(c<bc){bc=c;best=perm;} }
    }
    const round=[];
    pa.forEach((x,i)=>{ const y=best[i]; const ka="A:"+key(x[0].id,x[1].id), kb="B:"+key(y[0].id,y[1].id);
      pairs[ka] ||= {team:"A", players:[x[0].id,x[1].id]}; pairs[kb] ||= {team:"B", players:[y[0].id,y[1].id]};
      round.push({pairKeyA:ka, pairKeyB:kb, leg:1});
      [...x,...y].forEach(p=> played[p.id]=(played[p.id]||0)+1);
      partner[key(x[0].id,x[1].id)]=(partner[key(x[0].id,x[1].id)]||0)+1; partner[key(y[0].id,y[1].id)]=(partner[key(y[0].id,y[1].id)]||0)+1;
      x.forEach(p=> y.forEach(q=> faced[key(p.id,q.id)]=(faced[key(p.id,q.id)]||0)+1)); });
    for(let i=0;i<round.length;i+=Math.max(1,courts)) rounds.push(round.slice(i,i+Math.max(1,courts)));
  }
  const out=[]; rounds.forEach((r,ri)=> r.forEach((mm,ci)=> out.push({...mm, round:ri+1, court:ci+1, order:out.length, games:[], walkover:null, status:"scheduled"})));
  return {pairs, matches:out, played};
}
function standings(){
  const t = {A:{mw:0,ml:0,gw:0,gl:0,pf:0,pa:0}, B:{mw:0,ml:0,gw:0,gl:0,pf:0,pa:0}};
  const pairStats = {}; const playerStats = {};
  const ps = (coll,id)=> coll[id] ||= {sp:0,w:0,l:0,gw:0,gl:0,pf:0,pa:0};
  for(const m of S.matches){
    const r = matchResult(m); if(!r.done) continue;
    let gw=0, gl=0, pf=0, pa=0; // from pair A's point of view
    for(const g of (m.games||[])){ const [a,b]=g.map(x=>+x||0); pf+=a; pa+=b; const w=gameWinner(g); if(w==="A") gw++; if(w==="B") gl++; }
    t.A.pf+=pf; t.A.pa+=pa; t.B.pf+=pa; t.B.pa+=pf; t.A.gw+=gw; t.A.gl+=gl; t.B.gw+=gl; t.B.gl+=gw;
    if(r.winner==="A"){ t.A.mw++; t.B.ml++; } else { t.B.mw++; t.A.ml++; }
    const sides = [[m.pairA,"A",gw,gl,pf,pa],[m.pairB,"B",gl,gw,pa,pf]];
    for(const [pid,side,a,b,c,d] of sides){
      const won = r.winner===side; const add = st=>{ st.sp++; won?st.w++:st.l++; st.gw+=a; st.gl+=b; st.pf+=c; st.pa+=d; };
      add(ps(pairStats,pid)); (byId(S.allPairs,pid)?.players||[]).forEach(x=> add(ps(playerStats,x)));
    }
  }
  return {t, pairStats, playerStats};
}
function expenseSummary(){
  const evx = S.expenses.filter(e=>(!e.scope || e.scope==="event") && inEv(e));
  const total = evx.reduce((s,e)=>s+(+e.amount||0),0);
  const bal = {}; S.players.forEach(p=> bal[p.id]={paid:0, owes:0});
  for(const e of evx){
    if(e.paidBy && bal[e.paidBy]) bal[e.paidBy].paid += +e.amount||0;
    const group = S.players.filter(p => e.split==="all" || !e.split ? true : p.team===e.split);
    if(group.length){ const share = (+e.amount||0)/group.length; group.forEach(p=> bal[p.id].owes += share); }
  }
  const perHead = S.players.length ? total/S.players.length : 0;
  // settlement suggestions
  const debt = Object.entries(bal).map(([id,b])=>({id, net:b.paid-b.owes})).filter(x=>Math.abs(x.net)>=1);
  const cred = debt.filter(x=>x.net>0).sort((a,b)=>b.net-a.net), owe = debt.filter(x=>x.net<0).sort((a,b)=>a.net-b.net);
  const transfers=[]; let i=0,j=0;
  while(i<cred.length && j<owe.length){ const amt=Math.min(cred[i].net, -owe[j].net); transfers.push({from:owe[j].id, to:cred[i].id, amt}); cred[i].net-=amt; owe[j].net+=amt; if(cred[i].net<1) i++; if(owe[j].net>-1) j++; }
  return {total, perHead, bal, transfers};
}

function projectFixtures(){
  if(S.event.format==="rotation"){
    const nA=S.players.filter(p=>p.team==="A").length, nB=S.players.filter(p=>p.team==="B").length, target=S.event.matchesPerPlayer||3;
    const per=Math.min(Math.floor(nA/2),Math.floor(nB/2)), courts=S.event.courts||1;
    if(!per) return {rotation:true, nA, nB, per:0, total:0, rounds:0, perA:0, perB:0, block:0, q:0};
    const gcd=(a,b)=> b? gcd(b,a%b) : a, lcm=(a,b)=> a*b/gcd(a,b);
    const block = lcm(nA%2?nA:nA/2, nB%2?nB:nB/2);      // smallest match count where 2·M divides by both team sizes
    let q=1, bestD=Infinity; for(let x=1;x<=12;x++){ const d=Math.abs(2*x*block/nA-target)+Math.abs(2*x*block/nB-target); if(d<bestD){bestD=d;q=x;} }
    const total=q*block;
    return {rotation:true, nA, nB, per, block, q, total, rounds: Math.ceil(total/per)*Math.ceil(per/courts), perA:2*total/nA, perB:2*total/nB, target};
  }
  const pA = S.pairs.filter(p=>p.team==="A").length || Math.floor(S.players.filter(p=>p.team==="A").length/2);
  const pB = S.pairs.filter(p=>p.team==="B").length || Math.floor(S.players.filter(p=>p.team==="B").length/2);
  const legs = S.event.legs||1; const total = pA*pB*legs;
  const courts = S.event.courts||1; const perRound = Math.min(pA,pB)||1; const rounds = total ? Math.max(pA,pB)*legs*Math.ceil(perRound/courts) : 0;
  return {pA,pB,legs,total,rounds, perA:pB*legs, perB:pA*legs};
}
function projectedText(p){
  if(p.rotation){
    if(!p.per) return "Rotation format: once both teams have at least 2 registered players, the app builds rounds in which partners and opponents change every match, so everyone plays the same number of matches.";
    const sit = t=>{ const n=t==="A"?p.nA:p.nB; const out=n-2*p.per; return out>0?` (${out} of ${n} sit${out===1?"s":""} out each round, in turn)`:""; };
    return `<b>Rotation format</b> (Davis Cup style, no fixed pairs): <b>${p.total} matches</b> in ${Math.ceil(p.total/p.per)} rounds of up to ${p.per}. Every ${esc(S.event.shortA)} player plays <b>exactly ${p.perA}</b>${sit("A")}, every ${esc(S.event.shortB)} player <b>exactly ${p.perB}</b>${sit("B")}. Partners come from your own team and change every match; opponents rotate too. On ${S.event.courts} court${S.event.courts>1?"s":""} that is ${p.rounds} playing round${p.rounds>1?"s":""}.${p.block>1?` <span class="muted">Equal play with ${p.nA} vs ${p.nB} players works in blocks of ${p.block} matches; your target of ${p.target} per player rounds to ${p.q}×.</span>`:""}`;
  }
  if(!p.pA || !p.pB) return "Once both teams have at least 2 registered players, the app works out how many matches you need. Each pair from one team plays every pair of the other team.";
  const fixed = S.pairs.length>0;
  return `${fixed?"":"Based on registrations so far, "}${esc(S.event.shortA)} ${fixed?"has":"can field"} <b>${p.pA} pair${p.pA>1?"s":""}</b> and ${esc(S.event.shortB)} <b>${p.pB} pair${p.pB>1?"s":""}</b>, so the challenge is <b>${p.total} match${p.total>1?"es":""}</b>${p.legs>1?` (${p.legs} legs)`:""}: each ${esc(S.event.shortA)} pair plays ${p.perA}, each ${esc(S.event.shortB)} pair plays ${p.perB}. On ${S.event.courts} court${S.event.courts>1?"s":""} that is about ${p.rounds} round${p.rounds>1?"s":""}.`;
}

function matchCard(m){
  const r = matchResult(m); const pa=byId(S.allPairs,m.pairA), pb=byId(S.allPairs,m.pairB);
  const myIds = S.allPairs.filter(x=>(x.players||[]).includes(uid)).map(x=>x.id);

  const side = (k, pr)=>`<div class="side ${k} ${r.winner?(r.winner===k?"win":"lose"):""}"><div class="names"><span class="stripe"></span><span>${esc(pairLabel(pr))}</span>${r.winner===k?'<span class="pill good">W</span>':""}</div><div class="games">${games.map(g=>{const w=gameWinner(g); const v=k==="A"?g[0]:g[1]; return `<b class="${w?(w===k?"w":"l"):""}">${v===""||v==null?"·":v}</b>`;}).join("")}${m.walkover===k?'<b class="w">w/o</b>':""}</div></div>`;
  const status = r.done ? `<span class="pill good">Final</span>` : games.length ? `<span class="pill live">Live</span>` : `<span class="pill">Court ${m.court||"?"}</span>`;
  return `<button class="match ${mine?"mine":""}" data-act="match" data-id="${m.id}"><div class="hdr"><span>Round ${m.round||"?"}${m.leg>1?" · Leg "+m.leg:""}${mine?" · your match":""}</span>${status}</div>${side("A",pa)}${side("B",pb)}</button>`;
}

/* ---- Money ---- */
function vMoney(){
  let mo = S.filterMo || (myTeam() ? myTeam() : "event"); if(!isAdmin() && mo!=="event" && mo!==myTeam()) mo = myTeam()||"event";
  const teamBtns = isAdmin() ? `<button class="A" aria-pressed="${mo==="A"}" data-val="A">${esc(S.event.shortA)} sessions</button><button class="B" aria-pressed="${mo==="B"}" data-val="B">${esc(S.event.shortB)} sessions</button>` : myTeam() ? `<button class="${myTeam()}" aria-pressed="${mo===myTeam()}" data-val="${myTeam()}">${esc(teamShort(myTeam()))} sessions</button>` : "";
  const seg = `<div class="seg" data-seg="filterMo"><button aria-pressed="${mo==="event"}" data-val="event">${esc(S.ev.name||"Event")}</button>${teamBtns}</div>`;
  if(mo!=="event") return seg + vTeamMoney(mo);
  const {total, perHead, bal, transfers} = expenseSummary();
  const mine = me() ? bal[me().id] : null;
  const list = S.expenses.filter(e=>(!e.scope || e.scope==="event") && inEv(e)).sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0));
  return seg + `
  <div class="stats"><div class="stat"><b>${esc(money(total))}</b><span>Total</span></div><div class="stat"><b>${esc(money(Math.round(perHead)))}</b><span>Per head</span></div><div class="stat"><b class="balance ${mine?(mine.paid-mine.owes>=0?"pos":"neg"):""}">${mine?esc(money(Math.round(mine.paid-mine.owes))):"—"}</b><span>Your balance</span></div></div>
  ${isAdmin()?`<button class="btn primary block" data-act="addExpense">Add expense</button>`:""}
  <section class="stack"><div class="sec-head"><h3>Expenses</h3><span class="small muted">${list.length} item${list.length===1?"":"s"}</span></div>
  ${list.length?`<div class="list">${list.map(e=>`<button class="item" data-act="expense" data-id="${e.id}"><div class="t"><b>${esc(e.title)}</b><span>${esc(e.category||"Other")} · paid by ${esc(fullName(byId(S.players,e.paidBy))||"team pot")}${e.split&&e.split!=="all"?" · split "+esc(teamShort(e.split)):""}</span></div><span class="amt">${esc(money(e.amount))}</span></button>`).join("")}</div>`:`<div class="empty"><b>No expenses yet</b>Court booking, shuttles and snacks go here. Everyone sees the total and their share.</div>`}</section>
  ${S.players.length && S.expenses.length ? `<section class="card stack"><h3>Who owes what</h3><div class="scroll-x"><table class="table"><thead><tr><th>Player</th><th class="n">Paid</th><th class="n">Share</th><th class="n">Balance</th></tr></thead><tbody>
    ${S.players.map(p=>{const b=bal[p.id]; const n=b.paid-b.owes; return `<tr><td>${esc(fullName(p))}</td><td class="n">${esc(money(Math.round(b.paid)))}</td><td class="n">${esc(money(Math.round(b.owes)))}</td><td class="n balance ${n>=0?"pos":"neg"}">${n>0?"+":""}${esc(money(Math.round(n)))}</td></tr>`;}).join("")}
  </tbody></table></div>
  ${transfers.length?`<h3>Settle up</h3><div class="stack" style="gap:6px">${transfers.map(t=>`<div class="row spread small"><span>${esc(fullName(byId(S.players,t.from)))} → ${esc(fullName(byId(S.players,t.to)))}</span><b class="num">${esc(money(Math.round(t.amt)))}</b></div>`).join("")}</div>`:""}
  </section>`:""}`;
}

    <div class="row"><span class="pill ${e.registrationOpen?"good":"warn"}">Registration ${e.registrationOpen?"open":"closed"}</span><span class="pill ${e.allowPlayerScores?"good":""}">Players ${e.allowPlayerScores?"can":"can't"} enter scores</span></div>
  </section>
  ${e.format==="rotation" ? `<section class="card stack"><div class="sec-head"><h3>Pairs</h3><span class="pill">rotation</span></div><div class="small muted">Pairs are formed automatically for every match so partners rotate. Switch to “Fixed pairs” in Event settings to pick pairs by hand.</div></section>` : `<section class="card stack">
    <div class="sec-head"><h3>Pairs</h3>${picked.length===2?`<button class="btn primary sm" data-act="makePair">Pair ${esc(picked[0].first)} + ${esc(picked[1].first)}</button>`:`<span class="small muted">${picked.length===1?"Tap a team-mate to pair":"Tap two names to pair them"}</span>`}</div>
    <div class="pairgrid">${pairCol("A")}${pairCol("B")}</div>

function sheetRules(){
  const e=S.event, need=Math.ceil((e.bestOf||3)/2), T=e.pointsTo||21, cap=T+9;
  const h = t=>`<h3 style="margin-top:6px">${t}</h3>`;
  const ul = items=>`<ul style="margin:0;padding-left:20px;display:grid;gap:6px">${items.map(i=>`<li>${i}</li>`).join("")}</ul>`;
  openSheet("Rules", `<div class="stack" style="gap:12px;font-size:15px">
    ${e.houseRules?`<div class="banner info" style="display:block;white-space:pre-wrap;font-weight:500">${esc(e.houseRules)}</div>`:""}
    ${h("The challenge")}
    ${ul([
      e.format==="rotation" ? `<b>${esc(e.teamA)}</b> vs <b>${esc(e.teamB)}</b>, doubles only (2 v 2), Davis Cup style rotation: there are no fixed pairs. Each round every available player plays once, with a new partner and new opponents whenever possible, so every player of a team plays exactly the same number of matches (when a team has an odd number, players sit out in turn).` : `<b>${esc(e.teamA)}</b> vs <b>${esc(e.teamB)}</b>, doubles only (2 v 2). Every pair plays every pair of the other team${e.legs>1?` ${e.legs} times`:" once"}.`,
      `A match is <b>best of ${e.bestOf} game${e.bestOf>1?"s":""}</b> to <b>${T}</b> points (first to ${need} game${need>1?"s":""} wins).`,
      `The team with more match wins takes the challenge. Tie-break: games difference, then points difference, then one deciding match between pairs chosen by the captains.`,
      `Pairs and the schedule are set by the organiser in this app. Check your round and court under <b>Matches</b>; be at the court when the previous match finishes.`,
      `A pair that is not ready 10 minutes after being called forfeits the match (walkover) at the organiser's discretion.`,
      `Matches are self-umpired. The server calls the score aloud before every serve. If a call is disputed and the pairs can't agree, replay the rally.`,
      `Scores are entered in this app${e.allowPlayerScores?" by the winning pair right after the match":" by the organiser"}; both pairs confirm the result before leaving the court.`,
      `Shared costs (courts, shuttles, food) are tracked under <b>Money</b> and split as shown there.`
    ])}
    ${h("Scoring")}
    ${ul([
      `Rally point: every rally scores a point, whoever served.`,
      `A game goes to ${T}. At ${T-1}–${T-1} you need a 2-point lead; at ${cap-1}–${cap-1} the next point wins (${cap}).`,
      `Change ends after each game, and in the deciding game when the leading side reaches ${Math.ceil(T/2)}.`,
      `Short breaks: up to 60 seconds when a side first reaches ${Math.ceil(T/2)} in a game, up to 2 minutes between games.`
    ])}
    ${h("Serving in doubles")}
    ${ul([
      `Serve diagonally, from the <b>right</b> service court when your side's score is <b>even</b> (0, 2, 4…) and from the <b>left</b> when it is <b>odd</b>.`,
      `Hit the serve underarm with the whole shuttle below your waist (official rule: below 1.15 m), racket moving forward, both feet on the floor inside the service court. Don't step on the lines.`,
      `If the serving side wins the rally, the <b>same server</b> serves again from the other service court. Only the serving side swaps courts, and only when it scores.`,
      `If the receiving side wins the rally, it becomes the serving side; nobody changes courts. The player whose service court matches the new score (even = right, odd = left) serves.`,
      `Only the diagonally opposite player may return the serve. After the serve, anyone can hit the shuttle.`,
      `The serve must land in the diagonal doubles service box: beyond the short service line and inside the <b>inner</b> back line. For the rest of the rally the whole court out to the outer side and back lines is in.`
    ])}
    ${h("Faults")}
    ${ul([
      `The shuttle lands outside the lines (on the line is in), goes under or through the net, or doesn't cross the net.`,
      `The shuttle touches the ceiling, a wall, a player or their clothes.`,
      `A player hits the shuttle twice, or both partners hit it in one shot.`,
      `A player touches the net or posts with racket, body or clothes, or reaches over the net to hit (following through over the net after a hit on your side is fine).`,
      `The shuttle is hit before it crosses the net, or a player deliberately distracts or obstructs an opponent.`
    ])}
    ${h("Lets (replay the rally)")}
    ${ul([
      `The server serves before the receiver is ready (the receiver must not have tried to return).`,
      `The shuttle gets caught on the net after passing it, or breaks during the rally.`,
      `A shuttle from another court comes onto yours, or the rally is otherwise interrupted.`
    ])}
    ${h("Fair play")}
    ${ul([
      `Shake hands before and after. Call your own side's faults and shuttles that land on your side.`,
      `Keep the pace up: no coaching time-outs in the middle of a game, no long arguments over calls.`,
      `Help the organiser: bring the shuttles back, move your match on as soon as a court is free.`
    ])}
    <p class="tiny muted" style="margin:0">Based on the BWF Laws of Badminton; the organiser can add house rules in Admin → Event.</p>
    <div class="row"><a class="btn sm" href="https://hiteshmalhotra2583.github.io/badminton-challenge/docs/player-guide.pdf" target="_blank" rel="noopener">Player guide (PDF)</a>${isAdmin()?`<a class="btn sm" href="https://hiteshmalhotra2583.github.io/badminton-challenge/docs/admin-guide.pdf" target="_blank" rel="noopener">Admin guide (PDF)</a>`:""}</div>
  </div>`, "");
}

function eventStatus(ev){

}

async function shrinkPhoto(file, size=320, limit=60000){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const c=document.createElement("canvas"); c.width=c.height=size; const x=c.getContext("2d");
    const s=Math.min(img.width,img.height); x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
    let q=0.82, out=c.toDataURL("image/jpeg",q); while(out.length>limit && q>0.4){ q-=0.1; out=c.toDataURL("image/jpeg",q); }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

const myTeam = ()=> me()?.team || null;
const isActive = p => !!p && p.active!==false;
const amInactive = ()=> !!me() && !isActive(me()) && !isAdmin();
const isClubAdmin = t => !!me() && isActive(me()) && me().role==="clubAdmin" && myTeam()===t;
const canManage = t => isAdmin() || isClubAdmin(t);               // add/deactivate members, team setup, invites
const canManageTeam = t => isAdmin() || (myTeam()===t && isActive(me()));   // take part: vote, attendance, costs
const canEditTeam = t => isAdmin() || isClubAdmin(t);
const activePlayers = ()=> S.players.filter(isActive);
const teamCfg = t => S.teams.find(x=>x.id===t) || {id:t, enabled:false, weekday:0, start:"08:30", end:"09:30", location:"", address:"", voteDay:5, note:""};
function localISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function nextSessionDate(cfg, from=new Date()){
  const d=new Date(from); d.setHours(0,0,0,0); let add=((+cfg.weekday||0) - d.getDay() + 7) % 7;
  if(add===0){ const [h,m]=(cfg.end||"23:59").split(":").map(Number); const endT=new Date(from); endT.setHours(h,m,0,0); if(from>endT) add=7; }
  d.setDate(d.getDate()+add); return localISO(d);
}
function fmtDay(iso){ if(!iso) return ""; return new Date(iso+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long", day:"numeric", month:"short"}); }
function attendees(s){ return Array.isArray(s.attended) ? s.attended : Object.entries(s.rsvps||{}).filter(([,v])=>v==="yes").map(([k])=>k); }
const rsvpCount=(s,v)=> Object.values(s.rsvps||{}).filter(x=>x===v).length;
async function ensureNextSessions(){
  if(!store) return;
  for(const t of ["A","B"]){
    const cfg=teamCfg(t); if(!cfg.enabled || !canManageTeam(t)) continue;
    const date=nextSessionDate(cfg), id=`${t}_${date}`;
    if(S.sessions.some(s=>s.id===id) || S._ensured?.[id]) continue;
    (S._ensured ||= {})[id]=1;
    try{ await store.set("sessions", id, {team:t, date, start:cfg.start, end:cfg.end, location:cfg.location||"", address:cfg.address||"", lat:cfg.lat??null, lon:cfg.lon??null, note:"", rsvps:{}, attended:null, status:"open", auto:true, createdAt:Date.now(), createdBy:uid||null}); }catch(e){ console.warn(e); }
  }
}
function teamMoney(t){
  const members=S.players.filter(p=>p.team===t && (isActive(p) || p.id===uid)); const bal={}; S.players.filter(p=>p.team===t).forEach(p=>bal[p.id]=0);
  const items=S.expenses.filter(e=>e.scope==="team" && e.team===t); let total=0;
  for(const e of items){ const amt=+e.amount||0;
    if(e.type==="payment"){ if(bal[e.from]!=null) bal[e.from]+=amt; if(bal[e.to]!=null) bal[e.to]-=amt; }
    else { total+=amt; if(e.paidBy && bal[e.paidBy]!=null) bal[e.paidBy]+=amt; const among=(e.splitAmong||[]).filter(id=>bal[id]!=null); if(among.length){ const share=amt/among.length; among.forEach(id=>bal[id]-=share); } } }
  const debt=Object.entries(bal).map(([id,net])=>({id,net})).filter(x=>Math.abs(x.net)>=1);
  const cred=debt.filter(x=>x.net>0).sort((a,b)=>b.net-a.net), owe=debt.filter(x=>x.net<0).sort((a,b)=>a.net-b.net);
  const transfers=[]; let i=0,j=0;
  while(i<cred.length && j<owe.length){ const amt=Math.min(cred[i].net,-owe[j].net); transfers.push({from:owe[j].id,to:cred[i].id,amt}); cred[i].net-=amt; owe[j].net+=amt; if(cred[i].net<1) i++; if(owe[j].net>-1) j++; }
  return {members, bal, items, total, transfers};
}

/* ---- Maps: address search (OpenStreetMap/Nominatim) + Leaflet preview + directions link ---- */
async function geocode(q){
  const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q), {headers:{"Accept":"application/json"}});
  const j=await r.json(); if(!j.length) throw new Error("Address not found"); return {lat:+j[0].lat, lon:+j[0].lon, label:j[0].display_name};
}
let leafletP=null;
function loadLeaflet(){ if(window.L) return Promise.resolve(); return leafletP ||= new Promise((res,rej)=>{ const l=document.createElement("link"); l.rel="stylesheet"; l.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(l); const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); }); }
async function showMap(elId, lat, lon, opts={}){
  if(lat==null||lon==null) return;
  try{ await loadLeaflet(); const el=document.getElementById(elId); if(!el||!window.L) return; if(el._map){ el._map.remove(); el._map=null; }
    el.style.minHeight="170px";
    const map=L.map(el,{zoomControl:!!opts.interactive, dragging:!!opts.interactive, scrollWheelZoom:false, touchZoom:!!opts.interactive, doubleClickZoom:!!opts.interactive, attributionControl:false}).setView([lat,lon], 15);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
    const m=L.marker([lat,lon],{draggable:!!opts.interactive}).addTo(map);
    if(opts.onMove) m.on("dragend", ()=>{ const p=m.getLatLng(); opts.onMove(p.lat,p.lng); });
    el._map=map; setTimeout(()=>map.invalidateSize(),250);
  }catch(e){ console.warn("map", e); }
}
const mapsLink=(lat,lon,q)=> (lat!=null&&lon!=null) ? `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q||"")}`;
const placeLine=(o)=> (o.location||o.address) ? `<span class="muted small">${esc(o.location||"")}${o.address?(o.location?" · ":"")+esc(o.address):""}</span> <a class="lnk small" href="${mapsLink(o.lat,o.lon,[o.location,o.address].filter(Boolean).join(", "))}" target="_blank" rel="noopener">Directions ↗</a>` : "";
async function geoLookup(inputId, mapId, holder){
  const q=$("#"+inputId)?.value.trim(); if(!q){ toast("Type an address first"); return; }
  toast("Searching…");
  try{ const g=await geocode(q); S[holder]={lat:g.lat, lon:g.lon}; const lbl=$("#"+mapId+"Label"); if(lbl) lbl.textContent=g.label; await showMap(mapId, g.lat, g.lon, {interactive:true, onMove:(la,lo)=>{ S[holder]={lat:la, lon:lo}; }}); toast("Found — drag the pin to adjust"); }
  catch(e){ toast(e.message==="Address not found" ? "Address not found — try adding the city" : "Map search isn't available right now"); }
}

/* ---------------- Invites: admins (and members given invite rights) invite members, guests, or a guest for one session ---------------- */
const INVITE_KINDS={member:"Club member", guest:"Guest of the club", session:"Guest for one session"};
const canInvite = ()=> isAdmin() || (!!me() && isActive(me()) && (me().role==="clubAdmin" || !!me().canInvite));
const inviteCode = ()=> Array.from({length:8},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
const inviteLink = code => isDemo ? code : `${location.origin}${location.pathname}?invite=${code}`;
const inviteValid = inv => inv && (inv.expiresAt||0) > Date.now() && (inv.used||[]).length < (inv.maxUses||1);
function inviteText(inv){
  const who = inv.createdByName ? ` from ${inv.createdByName}` : "";
  const what = inv.kind==="session" ? `to play with ${teamName(inv.team)} on ${inv.sessionLabel||"a session"}` : inv.kind==="guest" ? `to join ${teamName(inv.team)} as a guest` : `to join ${teamName(inv.team)}`;
  return `Invitation${who} ${what}. Open the link, tap Register and you're in: ${inviteLink(inv.code)}`;
}

async function copyText(txt){ try{ await navigator.clipboard.writeText(txt); toast("Copied"); }catch(e){ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast("Copied"); }catch(_){ toast("Copy failed — select the text manually"); } ta.remove(); } }
async function shareInvite(inv){
  const text=inviteText(inv);
  if(navigator.share){ try{ await navigator.share({title:"Badminton invite", text}); return; }catch(e){ if(e.name==="AbortError") return; } }
  window.open("https://wa.me/?text="+encodeURIComponent(text), "_blank", "noopener");
}
// Invitee side: a code arrives via ?invite=CODE (or #invite-CODE), is remembered until the person registers.
function pickupInviteFromUrl(){
  try{ const u=new URL(location.href); let code=u.searchParams.get("invite"); if(!code && /^#invite-/.test(location.hash)) code=location.hash.slice(8);
    if(code){ lsSet("ppc_invite", code.toUpperCase()); u.searchParams.delete("invite"); if(/^#invite-/.test(u.hash)) u.hash=""; history.replaceState(null,"",u.toString()); } }catch(e){}
}
async function loadPendingInvite(){
  const code=lsGet("ppc_invite", null); if(!code || me() || !store?.get){ S.pendingInvite=null; return; }
  try{ const inv=await store.get("invites", code); S.pendingInvite = inv ? {id:code, ...inv} : {id:code, missing:true}; }catch(e){ S.pendingInvite={id:code, missing:true}; }
  if(!$("#sheetHost").children.length) render();
}
function inviteBanner(){
  const inv=S.pendingInvite; if(!inv || me()) return "";
  if(inv.missing || !inviteValid(inv)) return `<div class="banner"><span class="grow">This invite link is no longer valid. Ask ${inv.createdByName?esc(inv.createdByName):"the organiser"} for a new one.</span><button class="btn sm" data-act="dropInvite">Dismiss</button></div>`;
  return `<section class="card stack" style="border-color:var(--accent)"><h3>You're invited</h3><div>${inv.createdByName?`<b>${esc(inv.createdByName)}</b> invites you `:"You're invited "}${inv.kind==="session"?`to play with <b>${esc(teamName(inv.team))}</b> on <b>${esc(inv.sessionLabel)}</b>`:inv.kind==="guest"?`to join <b>${esc(teamName(inv.team))}</b> as a guest`:`to join <b>${esc(teamName(inv.team))}</b>`}.</div><button class="btn primary" data-act="register">Register and join</button></section>`;

async function finishInvite(inv){
  try{ await store.update("invites", inv.id, {used:[...(inv.used||[]), uid], updatedAt:Date.now()}); }catch(e){ console.warn(e); }
  if(inv.kind==="session" && inv.sessionId){ try{ const s=byId(S.sessions,inv.sessionId) || await store.get("sessions", inv.sessionId); const rs={...(s?.rsvps||{})}; rs[uid]="yes"; await store.update("sessions", inv.sessionId, {rsvps:rs, updatedAt:Date.now()}); }catch(e){ console.warn(e); } }
  lsSet("ppc_invite", null); S.pendingInvite=null;

const VAPID_KEY = "BEp83PZFT1pHb74CA8jrUv9zsXW81I-Dp2IcVHNYy230YI0rBSbFWIfGNouHHTwlLki0o-lgtTD9hvPhJqIAVow";
async function registerPush(interactive){
  if(isDemo){ if(interactive) toast("Notifications need the live app, not the demo"); return; }
  if(!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)){ if(interactive) toast("This browser can't receive notifications. On iPhone, add the app to the Home Screen first."); return; }
  if(!VAPID_KEY || VAPID_KEY.startsWith("__")){ if(interactive) toast("Notifications aren't configured yet"); return; }
  try{
    let perm=Notification.permission; if(perm!=="granted" && interactive) perm=await Notification.requestPermission();
    if(perm!=="granted"){ if(interactive) toast("Notifications are blocked for this app"); return; }
    const base=`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`; const msg=await import(base+"firebase-messaging.js");
    const reg=await navigator.serviceWorker.ready;
    const token=await msg.getToken(msg.getMessaging(S.fbApp), {vapidKey:VAPID_KEY, serviceWorkerRegistration:reg});
    if(!token) throw new Error("no token");
    await store.set("pushTokens", uid, {token, at:Date.now(), ua:navigator.userAgent.slice(0,120)});
    S.pushOn=true; if(interactive){ toast("Notifications on"); render(); }
    msg.onMessage(msg.getMessaging(S.fbApp), p=>{ toast(p.notification?.title||"New notification"); });
  }catch(e){ console.warn(e); if(interactive) toast("Couldn't enable notifications: "+(e.code||e.message)); }
}

          toast(`${res.matches.length} matches scheduled`); S.tab="matches"; render(); return;
        }
        const pa=S.pairs.filter(p=>p.team==="A"&&p.players?.length===2).sort((a,b)=>(a.order||0)-(b.order||0)), pb=S.pairs.filter(p=>p.team==="B"&&p.players?.length===2).sort((a,b)=>(a.order||0)-(b.order||0)); const fx=buildFixtures(pa,pb,S.event.legs||1,S.event.courts||1); await clearEv("matches"); for(const m of fx) await store.set("matches", store.newId(), {...m, eventId:S.eventId, createdAt:Date.now()}); toast(`${fx.length} matches scheduled`); S.tab="matches"; render(); });
      if(S.matches.length) confirmSheet("Regenerate schedule", `This replaces the current ${S.matches.length} matches and any scores entered.`, "Regenerate", go); else go(); },
    clearMatches: ()=> confirmSheet("Clear schedule", "Delete all matches and scores?", "Clear", ()=>guard(()=>clearEv("matches"))),
    addMatch: sheetAddMatch,
    saveNewMatch: ()=> guard(async ()=>{ await store.set("matches", store.newId(), {eventId:S.eventId, pairA:$("#amA").value, pairB:$("#amB").value, round:+$("#amRound").value||1, court:+$("#amCourt").value||1, leg:1, order:S.matches.length, games:[], walkover:null, status:"scheduled", createdAt:Date.now()}); closeSheet(); toast("Match added"); }),
    addAdmin: ()=> guard(async ()=>{ const v=$("#newAdmin").value; if(!v) return; await store.update("settings","admins",{uids:[...new Set([...(S.admins?.uids||[]), v])]}); toast("Admin added"); }),
    rmAdmin: ()=> guard(async ()=>{ await store.update("settings","admins",{uids:(S.admins?.uids||[]).filter(u=>u!==id)}); }),
    claimAdmin: ()=> guard(async ()=>{ await store.set("settings","admins",{uids:[uid], createdAt:Date.now()}); toast("You're the admin"); }),
    seed: ()=> guard(seedDemo),
    resetDemo: ()=> confirmSheet("Reset demo", "Delete all demo data on this device?", "Reset", ()=>store.reset()),
  };
  A[act]?.();
});

/* ---------------- Boot ---------------- */
async function migrateEvents(){
  if(!isAdmin() || !store) return;
  for(const ev of S.events){ if(!Array.isArray(ev.clubs) || !ev.clubs.length){ try{ await store.update("events", ev.id, {clubs:["A","B"]}); }catch(e){ console.warn(e); } } }
  if(S.events.length || S._migrated) return; S._migrated=true;
  const ev=allEvents()[0]; const {id, virtual, ...data}=ev;
  try{ await store.set("events", "main", {...data, clubs:["A","B"], type:data.type||"challenge", createdAt:Date.now()}); }catch(e){ console.warn(e); }
}
async function boot(){
  view.innerHTML = `<div class="empty"><b>Loading…</b>Connecting to the challenge.</div>`;
  try{
    if(isDemo){ store = makeDemoStore(); uid = lsGet(uidKey()) || (lsSet(uidKey(), rnd()), lsGet(uidKey())); }
    else store = await makeFirebaseStore();
  }catch(e){ console.error(e); view.innerHTML = `<div class="empty"><b>Can't connect</b>${esc(e.message||e)}<br><span class="small">Check the Firebase config and that Anonymous sign-in is enabled.</span></div>`; return; }
  let first = true;
  const ready = {};
  const after = ()=>{ refreshScopedSubs(); if(Object.keys(ready).length>=2 || !first) { first=false; if(!$("#sheetHost").children.length) render(); else renderTabs(); } };
  const sub = (c, fn)=> store.subscribe(c, rows => { fn(rows); ready[c]=true; after(); });
  S.scoped = {}; S.scopedData = {eventExpenses:[], teamExpenses:[]};
  const resub = (name, col, filter, fn)=>{ S.scoped[name]?.(); S.scoped[name]=null; if(filter===false){ fn([]); return; } S.scoped[name]=store.subscribe(col, rows=>{ fn(rows); after(); }, filter); };
  // Subscriptions whose query depends on who is reading (club, admin) and which event is selected.
  // The Firestore rules only allow exactly these queries, so a member never receives another club's data.
  window.refreshScopedSubs = function(){
    const inactive = amInactive(); const t = inactive ? null : myTeam(), adm=isAdmin(); const key1=JSON.stringify([t,adm,canInvite(),inactive]);
    if(S._scope1!==key1){ S._scope1=key1;
      resub("events","events", adm ? null : t ? {field:"clubs", op:"array-contains", value:t} : false, rows=>{ S.events=rows; recomputeEvent(); setTimeout(migrateEvents, 800); });
      resub("sessions","sessions", adm ? null : t ? {field:"team", op:"==", value:t} : false, rows=>{ S.sessions=rows; setTimeout(ensureNextSessions, 500); });
      resub("teams","teams", adm ? null : t ? {id:t} : false, rows=>{ S.teams=rows; setTimeout(ensureNextSessions, 500); });
      resub("invites","invites", adm ? null : (t && canInvite()) ? {field:"createdBy", op:"==", value:uid} : false, rows=>{ S.invites=rows; });
      const mergeOwn = ()=>{ const seen=new Set(); S.scopedData.teamExpenses=[...(S.scopedData.own1||[]),...(S.scopedData.own2||[]),...(S.scopedData.own3||[]),...(S.scopedData.own4||[])].filter(e=> e.scope==="team" && !seen.has(e.id) && seen.add(e.id)); S.expenses=[...S.scopedData.eventExpenses, ...S.scopedData.teamExpenses]; };
      if(inactive){ // an inactive member keeps read access to the costs and payments they are part of
        resub("teamExpenses","expenses", false, ()=>{});
        resub("own1","expenses", {field:"splitAmong", op:"array-contains", value:uid}, rows=>{ S.scopedData.own1=rows; mergeOwn(); });
        resub("own2","expenses", {field:"paidBy", op:"==", value:uid}, rows=>{ S.scopedData.own2=rows; mergeOwn(); });
        resub("own3","expenses", {field:"from", op:"==", value:uid}, rows=>{ S.scopedData.own3=rows; mergeOwn(); });
        resub("own4","expenses", {field:"to", op:"==", value:uid}, rows=>{ S.scopedData.own4=rows; mergeOwn(); });
      } else {
        ["own1","own2","own3","own4"].forEach(k=>{ S.scoped[k]?.(); S.scoped[k]=null; S.scopedData[k]=[]; });
        resub("teamExpenses","expenses", adm ? {field:"scope", op:"==", value:"team"} : t ? {field:"team", op:"==", value:t} : false, rows=>{ S.scopedData.teamExpenses=rows.filter(e=>e.scope==="team"); S.expenses=[...S.scopedData.eventExpenses, ...S.scopedData.teamExpenses]; });
      }
    }
    const key2=JSON.stringify([S.eventId, !!(t||adm)]);
    if(S._scope2!==key2){ S._scope2=key2; const ok = !!(t||adm) && !!S.eventId;
      resub("pairs","pairs", ok ? {field:"eventId", op:"==", value:S.eventId} : false, rows=>{ S.allPairs=rows; recomputeEvent(); });
      resub("matches","matches", ok ? {field:"eventId", op:"==", value:S.eventId} : false, rows=>{ S.allMatches=rows; recomputeEvent(); });
      resub("eventExpenses","expenses", ok ? {field:"eventId", op:"==", value:S.eventId} : false, rows=>{ S.scopedData.eventExpenses=rows.filter(e=>e.scope!=="team"); S.expenses=[...S.scopedData.eventExpenses, ...S.scopedData.teamExpenses]; });
    }
  };
  sub("settings", rows => { const ev=rows.find(r=>r.id==="event"); S.settingsEvent = ev ? (({id,...r})=>r)(ev) : null; S.admins = rows.find(r=>r.id==="admins")||null; S.adminsLoaded=true; recomputeEvent(); });
  sub("players", rows => S.players = rows);
  if(location.hash==="#sessions") S.tab="sessions";
  pickupInviteFromUrl(); setTimeout(loadPendingInvite, 1500);
  if(!isDemo && "Notification" in window && Notification.permission==="granted") setTimeout(()=>registerPush(false), 2000);
  setTimeout(()=>{ if(first){ first=false; render(); } }, 3000);
  setInterval(()=>{ if(S.tab==="home" && !$("#sheetHost").children.length) render(); }, 60000);
  if("serviceWorker" in navigator && !isDemo && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
}

const _render = render; render = function(){ _render(); if(!isDemo && S.adminsLoaded && !S.admins && S.tab==="home"){ view.insertAdjacentHTML("afterbegin", `<div class="banner"><span class="grow">No organiser yet. Are you setting this up?</span><button class="btn primary" data-act="claimAdmin">Claim admin</button></div>`); } };
boot();
