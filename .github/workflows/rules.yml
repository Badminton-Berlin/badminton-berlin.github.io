name: Deploy Firestore rules
on:
  push:
    branches: [main]
    paths: ["firestore.rules", "scripts/deploy-rules.mjs", ".github/workflows/rules.yml"]
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@13
      - name: Publish rules
        run: node scripts/deploy-rules.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
